<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; form-action https://docs.google.com; base-uri 'none'">
<title>Theory Practice</title>
<style>
/* Theory Practice: Tawa College style, unit colour indigo (RULES 6). Lexend for headings, Fira Sans for text, Kalam for
   student work, Bravura for printed music. Fonts are served from the site (theory/fonts), not a CDN. */
@font-face { font-family: "Lexend"; src: url(theory/fonts/lexend.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url(theory/fonts/FiraSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url(theory/fonts/FiraSans-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Kalam"; src: url(theory/fonts/Kalam-Regular.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Bravura"; src: url(theory/fonts/bravura.woff2) format("woff2"); font-display: swap; }

:root { --base: #3F3D8F; --shade: #2F2E6B; --tint: #D9D8E9; --light: #B2B1D2; --red: #D8001D; --ink: #2B2B2B; --grey: #6E6E6E;
  --pencil: #4D4D4D; --divider: #B0B0B0; --page: #FFFFFF; --sp: 26px; color-scheme: light; }
@media (min-width: 1500px) { :root { --sp: 36px; } html { font-size: 21px; } }
* { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 1rem/1.5 "Fira Sans", system-ui, sans-serif; }
a { color: var(--base); }
.hand { font-family: "Kalam", cursive; color: var(--pencil); }
.mus { font-family: "Bravura"; }
svg text { font-family: "Fira Sans", sans-serif; }
svg text.mus { font-family: "Bravura"; }
.st { display: block; margin: 0 auto; overflow: visible; }

.sheet { max-width: 1120px; margin: 0 auto; padding: 18px 16px 8px; }
@media (min-width: 1500px) { .sheet { max-width: 1560px; } }
.sheet > * + * { margin-top: 16px; }

/* the banner */
.banner { background: var(--base); color: #fff; border-radius: 22px 22px 0 0; padding: 20px 26px; display: flex; gap: 16px; align-items: center; justify-content: space-between; min-height: 6.4rem; margin-bottom: -16px; }
.banner .eyebrow { font: 700 .72rem/1 "Lexend", sans-serif; letter-spacing: .22em; text-transform: uppercase; }
.banner h1 { font: 700 2rem/1.15 "Lexend", sans-serif; margin: .5rem 0 0; }
.banner .corner { background: #fff; color: var(--shade); border-radius: 12px; padding: 10px 16px; font: 600 .9rem/1.3 "Lexend", sans-serif; text-align: center; text-decoration: none; min-width: 8rem; }
.scorebox { display: flex; flex-direction: column; gap: 2px; }
.scorebox .slab { font-weight: 400; font-size: .75rem; }
.scorebox b { font: 700 1.4rem/1.1 "Lexend", sans-serif; }
.scorebox a { font-size: .8rem; font-weight: 500; margin-top: 2px; }

/* the frame: 2 pt indigo border, rounded corners, like the 13 October pages */
.frame { border: 2px solid var(--base); border-top: 0; border-radius: 0 0 22px 22px; overflow: hidden; background: #fff; margin-top: 0; }
.info { background: var(--tint); padding: 18px 26px 22px; }
.todo { background: #fff; padding: 18px 26px 24px; }
.label { font: 700 .72rem/1 "Lexend", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--shade); margin: 0 0 12px; }
.infotext { font-size: 1.15rem; margin: 0 0 6px; max-width: 60rem; }
.figwrap { margin-top: .8rem; }
.fig { margin: 0 auto; }
h2.wtd { font: 700 1.35rem/1.25 "Lexend", sans-serif; color: var(--shade); margin: 0 0 .3rem; }
.hint { margin: 0 0 .5rem; font-size: 1.1rem; max-width: 56rem; }
.instr { margin: 0 0 .6rem; }

/* Learn */
.exwrap { max-width: 900px; margin: .8rem auto .4rem; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
.exwrap .st { max-width: 100%; }
.stroke-cap { font: 500 1.2rem/1.3 "Lexend", sans-serif; color: var(--shade); text-align: center; margin: .6rem 0; }
.strokeno { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--base); color: #fff; font-size: 1rem; margin-right: .4rem; }
.dots { display: flex; justify-content: center; gap: .5rem; }
.dots .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--tint); }
.dots .dot.on { background: var(--base); }
.learnnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.learnnav .count { font: 500 1rem/1 "Lexend", sans-serif; color: var(--shade); }
.replay { margin-top: .4rem; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes appear2 { from { opacity: 0; } to { opacity: 1; } }
.example .ans, .example input.box[readonly], .example .opt.pen, .example .wk.on, .example .cell input[readonly] { animation: appear .8s ease 1.2s both; }
.example.again .ans, .example.again input.box[readonly], .example.again .opt.pen, .example.again .wk.on, .example.again .cell input[readonly] { animation-name: appear2; }
html.still .example *, html.still .example { animation: none !important; }

/* buttons */
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; font: 600 1rem/1 "Lexend", sans-serif; color: var(--base); background: #fff; border: 2px solid var(--base); border-radius: 12px; padding: .75rem 1.1rem; min-height: 2.9rem; text-decoration: none; }
.btn:hover { background: var(--tint); }
.btn.solid { background: var(--base); color: #fff; }
.btn.solid:hover { background: var(--shade); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 2.3rem; padding: .45rem .8rem; font-size: .85rem; }
.btn:focus-visible, a:focus-visible, input:focus-visible, .piece:focus-visible, .tap:focus-visible, .tapkey:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.opts { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.opt { min-width: 3.4rem; font-size: 1.05rem; }
.opt.chosen { background: var(--tint); }
.opt.pen { font-family: "Kalam", cursive; font-weight: 400; color: var(--pencil); border-color: var(--pencil); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--pencil); }
.mark-btn svg.mk { width: 1.6rem; height: 1.6rem; }

/* home and lesson menu */
.home { padding: 22px 26px 28px; }
.lessonshead { font: 700 1.5rem/1.2 "Lexend", sans-serif; color: var(--shade); margin: 0 0 .8rem; }
.lessons { list-style: none; margin: 0 0 1.2rem; padding: 0; display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); }
.lrow { display: grid; grid-template-columns: 2.6rem 1fr; grid-template-rows: auto auto; column-gap: .8rem; align-items: center; border: 2px solid var(--light); border-radius: 14px; padding: .65rem .9rem; text-decoration: none; color: var(--ink); min-height: 4rem; }
.lrow:hover { border-color: var(--base); background: var(--tint); }
.ln { grid-row: 1 / 3; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--base); color: #fff; display: grid; place-items: center; font: 700 1.1rem/1 "Lexend", sans-serif; }
.lt { font: 600 1.05rem/1.25 "Lexend", sans-serif; color: var(--shade); }
.ls { font-size: .85rem; color: var(--grey); min-height: 1.2em; }
.progline { margin: 1rem 0 0; color: var(--grey); }

/* practise */
.practise { padding: 18px 26px 28px; }
.before { margin: 0 0 1rem; }
section.task { margin: 0; }
hr.divide { border: 0; border-top: 2px dashed var(--divider); margin: 1.6rem 0 1.4rem; }
.th { font: 700 1.35rem/1.3 "Lexend", sans-serif; color: var(--shade); margin: 0 0 .6rem; }
.th a { color: var(--base); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cardmin, 12rem), 1fr)); gap: 1rem; }
[data-type="line-or-space"] .items, [data-type="name-note"] .items, [data-type="name-note-octave"] .items, [data-type="clear-note"] .items { --cardmin: 11.5rem; }
[data-type="which-line"] .items, [data-type="which-space"] .items { --cardmin: 11rem; }
[data-type="higher-note"] .items, [data-type="up-down"] .items, [data-type="step-leap"] .items, [data-type="find-letter"] .items { --cardmin: 17rem; }
[data-type="hidden-word"] .items, [data-type="note-to-key"] .items { --cardmin: 18rem; }
[data-type="next-letter"] .items, [data-type="fill-gaps"] .items, [data-type="fill-octave"] .items { --cardmin: 24rem; }
[data-type="find-key"] .items, [data-type="name-key"] .items, [data-type="name-key-octave"] .items,
[data-type="copy-note"] .items, [data-type="place-note-named"] .items, [data-type="place-note-letter"] .items, [data-type="spell-word"] .items,
[data-type="place-clef"] .items, [data-type="grand-staff-place"] .items { --cardmin: 100%; }
@media (max-width: 700px) { .items { grid-template-columns: repeat(auto-fill, minmax(min(var(--cardmin, 12rem), 100%), 1fr)); } }
.item { position: relative; border: 2px solid transparent; border-radius: 14px; padding: .6rem .5rem .5rem; display: flex; flex-direction: column; gap: .5rem; align-items: stretch; background: #fff; }
.item.right { border-color: var(--base); }
.item.wrong { border-color: var(--base); }               /* red is only for notation marks (RULES 6.4); the cross says wrong */
.item .num { position: absolute; top: .45rem; left: .55rem; font: 700 .85rem/1 "Lexend", sans-serif; color: var(--grey); }
.item .body { display: flex; flex-direction: column; align-items: center; gap: .5rem; width: 100%; }
.actions { display: flex; justify-content: center; }
.fb { display: flex; gap: .5rem; align-items: flex-start; min-height: 1.4em; font-size: .98rem; }
.fbicon svg.mk { width: 1.5rem; height: 1.5rem; flex: none; }
.fbtext { padding-top: .1rem; }
.item.model { background: #F4F4F8; }
.prompt, .prompt-letter { font: 700 1.6rem/1 "Lexend", sans-serif; color: var(--shade); text-align: center; }
.prompt-letter { margin-top: .2rem; }

/* boxes */
.box { width: 2.7rem; height: 2.7rem; border: 2px solid var(--base); border-radius: 4px; background: #fff; text-align: center; font: 600 1.3rem/1 "Fira Sans", sans-serif; color: var(--ink); padding: 0; text-transform: uppercase; }
.box.wide { width: 3.5rem; }
.box[readonly] { font-family: "Kalam", cursive; font-weight: 400; color: var(--pencil); background: #fff; }
.box:disabled { background: #F4F4F8; color: var(--ink); opacity: 1; }
.model { font-family: "Kalam", cursive; color: var(--pencil); font-size: 1.15rem; margin-left: .25rem; }
.stavebox { position: relative; width: 100%; padding-bottom: 3.3rem; margin: 0 auto; }
.boxrow { position: absolute; left: 0; right: 0; bottom: 0; height: 3.1rem; }
.bx { position: absolute; top: 0; transform: translateX(-50%); display: flex; align-items: center; white-space: nowrap; }
.keypick { text-align: center; color: var(--grey); font-size: .95rem; }
.letters { display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; }
.cell { width: 2.9rem; height: 2.9rem; border: 2px solid var(--base); border-radius: 6px; display: grid; place-items: center; background: #fff; }
.cell.fixed { background: var(--tint); font: 700 1.4rem/1 "Fira Sans", sans-serif; color: var(--shade); }
.cell .box { width: 100%; height: 100%; border: 0; border-radius: 4px; }
.rowarrow { width: 100%; max-width: 30rem; height: 1.2rem; display: block; margin: 0 auto .2rem; }

/* keyboards */
.kb { width: 100%; display: grid; gap: .7rem; }
.kbrow { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); width: 100%; max-height: 14rem; }
.wk { position: relative; background: #fff; border: 1px solid var(--ink); border-left: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4%; min-width: 0; }
.wk:first-child { border-left: 1px solid var(--ink); }
.bk { position: absolute; top: 0; height: 62%; background: var(--ink); border-radius: 0 0 3px 3px; z-index: 2; pointer-events: none; }
.tapkey { cursor: pointer; }
.wk.on { background: var(--tint); }
.wk.ans { box-shadow: inset 0 0 0 3px var(--pencil); }
.wk.pick { background: var(--tint); box-shadow: inset 0 0 0 3px var(--base); }
.wk .mark { position: absolute; bottom: 6%; font-size: 1.1rem; color: var(--pencil); }
.klab { font: 400 clamp(.6rem, 1.1vw, .9rem)/1 "Fira Sans", sans-serif; color: var(--shade); }
.klab.hand { font-family: "Kalam", cursive; font-size: clamp(.7rem, 1.4vw, 1.1rem); color: var(--pencil); }
.klab.b { font-weight: 700; }
.kb-bx { width: 94%; display: flex; justify-content: center; position: relative; z-index: 3; }
.kb-bx .box { width: 100%; height: 2.3rem; padding: 0; font-size: 1rem; border-width: 2px; }
.kb-bx .box.wide { font-size: .95rem; }
.sharedkb { margin-top: 1rem; }

/* drawing */
.draw { touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.draw .piece { cursor: grab; }
.draw .piece:focus { outline: none; }
.draw .piece:focus-visible .hit { stroke: var(--base); stroke-width: .08; stroke-dasharray: .3 .2; }
.draw .handle.size { cursor: nwse-resize; }
.draw .handle.move { cursor: move; }
.draw.locked .piece { pointer-events: none; }
.banklab { pointer-events: none; }
.drawbar { display: flex; gap: .8rem; align-items: center; justify-content: center; color: var(--grey); font-size: .92rem; }
svg.tapfocus { outline: none; }
.tap { cursor: pointer; }

.finish { margin-top: 1.6rem; padding: 1.2rem 0 0; border-top: 2px dashed var(--divider); text-align: center; }
.bigscore { font-size: 1.6rem; margin: .2rem 0 1rem; }
.bigscore b { font-family: "Lexend", sans-serif; color: var(--shade); }
.finish .row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
.finish[hidden] { display: none; }

footer { text-align: center; font-size: .82rem; color: var(--grey); border-top: 1px solid #ddd; padding: 12px 0 20px; margin-top: 20px; }
footer b { color: var(--ink); }

@media (max-width: 600px) {
  html { font-size: 16px; }
  .sheet { padding: 10px 8px 4px; }
  .banner { padding: 14px 16px; border-radius: 16px 16px 0 0; }
  .banner h1 { font-size: 1.5rem; }
  .banner .corner { min-width: 5.5rem; padding: 8px 10px; }
  .info, .todo, .practise, .home { padding-left: 14px; padding-right: 14px; }
  .frame { border-radius: 0 0 16px 16px; }
  .th { font-size: 1.15rem; }
  .lessons { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .example *, .example { animation: none !important; } }
[hidden] { display: none !important; }
.opts { gap: .4rem; }
.opt { min-width: 2.6rem; padding-left: .6rem; padding-right: .6rem; }
svg text { pointer-events: none; }
/* ---- Lessons 13 on: rhythm figures and picture options ---- */
.rwrap { display: flex; justify-content: center; margin-bottom: .4rem; }
.rfig { overflow: visible; }
.opts.pics { gap: .8rem; }
.opt.pick.pic { padding: .3rem .5rem; min-width: 0; }
.opt.pick.pic .rfig { width: 100%; height: auto; display: block; }
.opt.pick.pic.chosen { background: var(--tint); }
.opt.pick.pic.pen { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--pencil); }
.textfig { max-width: 100%; }
.clue { font-family: "Lexend", sans-serif; font-weight: 600; color: var(--shade); font-size: 1.05rem; margin: .2rem 0 .6rem; text-align: center; }
.clue.big { font-size: 1.6rem; }
[data-type="stem-pick"] .items { --cardmin: 24rem; }
[data-type="longer-note"] .items, [data-type="matching-note"] .items, [data-type="missing-note"] .items { --cardmin: 22rem; }
.opts.pics .opt.pick.pic { flex: 1 1 40%; max-width: 48%; }
.opt.pick.pic .rfig { width: 100%; max-width: 100%; }
[data-type="note-tree"] .items { --cardmin: 24rem; }
[data-type="add-beats"] .items { --cardmin: 16rem; }
.opt.pick.pic .rfig { max-width: 8rem; margin: 0 auto; }

/* ---- one question at a time, and the Help panel ---- */
[hidden] { display: none !important; }
.prog { display: flex; align-items: center; gap: 1rem; margin: 0 0 1rem; font: 600 .95rem "Lexend", sans-serif; color: var(--shade); }
.prog .bar { flex: 1; height: .6rem; border-radius: 99px; background: var(--tint); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--base); border-radius: 99px; transition: width .3s; }
/* one question at a time: the question gets the width of the column. Only Lesson 1's types so far: other lessons'
   items were laid out for the narrow grid card, and each lesson's own chat switches them over after checking them */
.single .practise :is([data-type="line-or-space"], [data-type="which-line"], [data-type="which-space"]) .items { display: block; max-width: 46rem; margin: 0 auto; }
.single .practise :is([data-type="line-or-space"], [data-type="which-line"], [data-type="which-space"]) .item { --sp: 42px; }
.single .practise .th { margin-bottom: .8rem; }
.nextrow { display: flex; justify-content: center; margin-top: 1rem; }
.cornerrow { display: flex; align-items: center; gap: .8rem; }
.helpbtn { font: 700 1rem "Lexend", sans-serif; background: #fff; color: var(--shade); border: 2px solid #fff; border-radius: 12px; padding: .7rem 1.1rem; cursor: pointer; min-height: 2.75rem; }
.helpbtn:hover { background: var(--tint); }
/* the Home button in a lesson's top corner, in place of the Lessons link under the score (Isaac, 9 November 2026) */
a.homebtn { display: inline-flex; align-items: center; text-decoration: none; }
.helpbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.helpdlg { border: 3px solid var(--base); border-radius: 18px; padding: 0; max-width: min(56rem, 94vw); width: 94vw; max-height: 90vh; overflow: auto; color: var(--ink); }
.helpdlg::backdrop { background: rgba(30, 30, 70, .55); }
.helpbody { padding: 1.2rem 1.5rem 0; }
.helpbody .label { font: 700 .75rem "Lexend", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--shade); margin: .8rem 0 .3rem; }
.helpbody .wtd { font: 700 1.3rem "Lexend", sans-serif; color: var(--shade); margin: .2rem 0 .4rem; }
.helpbody .hsteps { margin: .4rem 0 0 1.2rem; }
.helpfoot { display: flex; justify-content: center; padding: 1rem; position: sticky; bottom: 0; background: #fff; }
@media (max-width: 700px) { .cornerrow { gap: .4rem; } .helpbtn { padding: .5rem .7rem; font-size: .9rem; min-height: 2.75rem; } .banner .corner { min-width: 5.6rem; padding: 8px 10px; } .single .practise :is([data-type="line-or-space"], [data-type="which-line"], [data-type="which-space"]) .item { --sp: 28px; } }
.helpex { margin: .6rem 0 .2rem; }
.helpbody { padding-bottom: 1.4rem; }
.helpdlg[open] { display: flex; flex-direction: column; overflow: hidden; }
.helpbody { overflow: auto; flex: 1 1 auto; min-height: 0; }
.helpfoot { position: static; flex: none; border-top: 1px solid var(--tint); }

/* ---- Lesson 1 fixes (2 November 2026) ---- */
svg text.handsvg { font-family: "Kalam", cursive; }
/* one question at a time: the progress bar says which question it is, so the small number goes; an extra question is labelled */
.single .practise .item .num:not(.xlab) { display: none; }
.item .num.xlab { position: static; align-self: flex-start; font: 600 .8rem/1 "Lexend", sans-serif; color: var(--shade); background: var(--tint); border-radius: 99px; padding: .35rem .7rem; }
/* the tick or cross beside the feedback, big enough to see */
.fbicon { flex: none; width: 1.7rem; height: 1.7rem; }
.fbicon svg.mk { width: 100%; height: 100%; max-width: none; }
.fb { font-size: 1.05rem; align-items: center; }
/* the answer a student picked stays clear after it is marked; the others fade */
.opt.chosen:disabled, .opt.pen:disabled { opacity: 1; }
.opt.chosen { background: var(--tint); border-color: var(--shade); }
/* on touch screens a tapped button keeps :hover, so it looked still picked */
@media (hover: none) {
  .btn:not(.solid):not(.chosen):hover, .helpbtn:hover, .bigbtn:not(.solid):hover, .lrow:hover { background: #fff; }
  .btn.solid:hover, .bigbtn.solid:hover { background: var(--base); }
  .lrow:hover { border-color: var(--light); }
}
footer b { white-space: nowrap; }
/* phone: the Practise banner puts Help and the score on their own row under the title */
@media (max-width: 600px) {
  .practisesheet .banner { flex-wrap: wrap; row-gap: 12px; }
  .practisesheet .banner > :first-child { flex: 1 1 100%; }
  .practisesheet .cornerrow { flex: 1 1 100%; justify-content: space-between; }
  .practisesheet .scorebox { flex-direction: row; align-items: baseline; gap: .6rem; min-width: 0; }
  .practisesheet .scorebox b { white-space: nowrap; font-size: 1.2rem; }
  .banner .eyebrow { letter-spacing: .16em; }
}
/* projector: Learn grows to fill the screen (HANDOVER 4) */
@media (min-width: 1500px) and (min-height: 950px) {
  html[data-screen="learn"] { font-size: 27px; --sp: 52px; }
  html[data-screen="learn"] .sheet { max-width: 1840px; }
}
/* Help: What to do comes first; What we're learning is tinted, as on the page */
.helpinfo { background: var(--tint); border-radius: 12px; padding: .2rem 1rem 1rem; margin-top: 1rem; }
/* Lesson 1 diagram: two figures that sit side by side, or stack on a phone */
.figrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: .6rem 2.4rem; }
.figrow .fig { flex: 1 1 0; min-width: min(100%, 16rem); margin: 0; }
.opt.tried { border-style: dashed; color: var(--grey); border-color: var(--grey); background: #fff; }
.opt.tried.chosen { border-style: solid; color: var(--base); border-color: var(--shade); background: var(--tint); }
@media (max-width: 600px) { .practisesheet .banner { padding-bottom: 22px; } }
.drawtip { color: var(--grey); font-size: .9rem; }
.drawbar { flex-wrap: wrap; }

.example.again .exwrap .wk.on .mark { animation-name: appear2; }
.example.hold .exwrap .wk.on, .example.hold .exwrap .wk.on .mark { animation: none; }

/* ---- every lesson in the card style (Isaac, 8 November 2026) ---- */
/* a note lights up while it sounds (RULES 8.4): stave notes, rhythm notes, diagram notes, animation parts */
:is(.sn, .rn, .dn, .ak).lit text { fill: var(--base); }
:is(.sn, .rn, .dn, .ak).lit ellipse { stroke: var(--base); }
:is(.rn, .ak).lit rect, :is(.rn, .ak).lit polygon { fill: var(--base); }
.ak.lit > rect[fill="#fff"] { fill: var(--light); }
.lit.piece ellipse, .piece.lit path { stroke: var(--base); }
button.opt.lit { background: var(--tint); }
/* the card animations: one picture, parts appearing */
.sstage { width: min(100%, 36rem); padding-top: 0; }
.ascene { width: 100%; height: auto; max-height: clamp(9rem, 28vh, 15rem); display: block; margin: 0 auto; }
.ak { transition: opacity .35s; }
.ak.off { opacity: 0; }
.ak.ringed { opacity: 1; }
.handsvg { font-family: "Kalam", cursive; }
@media (max-height: 700px) { .ascene { max-height: 8.2rem; } }
/* the Listening Activities */
.hear { display: flex; flex-direction: column; align-items: center; gap: .7rem; }
.hfig { width: min(100%, 26rem); margin: .3rem auto 0; }
.hfig svg { width: 100%; height: auto; display: block; }
.hfig.hbefore { width: min(100%, 30rem); }
.hfig.rwrap { width: min(100%, 20rem); }
.single .practise [data-type^="listen-"] .opts.pics .opt.pick.pic { flex: 0 1 15rem; }
.single .practise [data-type^="listen-"] .opt.pick.pic .rfig, .tcard [class*="ex-listen-"] .opt.pick.pic .rfig { max-width: 14rem; width: 100%; }
.hfig.rwrap { width: min(100%, 14rem); }
.single .practise [data-type^="listen-"] .opts .opt:not(.pic) { min-width: 9rem; font-size: 1.15rem; padding: .7rem 1.2rem; }
@media (max-height: 700px) { .hfig { width: min(100%, 20rem); } .hfig.hbefore { width: min(100%, 24rem); } }
/* letter buttons with octave numbers (Lessons 11 and 12) */
.letterpad.withnums { flex-wrap: wrap; }
.letterpad .lpn { display: inline-flex; gap: .35rem; margin-left: .6rem; padding-left: .6rem; border-left: 2px solid var(--tint); }
@media (max-width: 600px) { .letterpad .lpn { margin-left: 0; padding-left: 0; border-left: 0; } }
/* on a wide screen a card's animation sits beside the worked example, so the card fits a Chromebook window */
@media (min-width: 900px) {
  .tcard.side { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); column-gap: 1.4rem; align-items: start; }
  .tcard.side > :is(.cardhead, .label, .hint) { grid-column: 1 / -1; }
  .tcard.side > .anim { grid-column: 1; grid-row: span 3; margin-top: .5rem; }
  .tcard.side > :is(.instr, .exwrap, .cardplay, .excap) { grid-column: 2; }
  .tcard.side > .instr { margin-top: .5rem; }
  .tcard.side .ascene { max-height: clamp(10rem, 34vh, 18rem); }
  .tcard.side .sstage { width: 100%; }
}
.tcard .exwrap .kbrow { aspect-ratio: auto !important; height: clamp(5rem, 16vh, 9rem); }
.oncard .before { display: none; }
.hfig.hkb, .hfig.hkb.hafter { width: min(100%, 30rem); }
.hfig.hkb .wk .mark { font-size: .95rem; }
.single .practise [data-type^="listen-"] .opts.pics .opt.pick.pic { flex: 0 0 15rem; max-width: 46%; }
.tcard.animated:not(.side) .ascene { max-height: clamp(10rem, 36vh, 18rem); }
@media (max-height: 700px) { .tcard.animated:not(.side) .ascene { max-height: 9rem; } }
/* the task buttons along the top of the frame (Isaac, 9 November 2026), small so the cards still fit the window */
.tasknav { display: none; flex-wrap: wrap; justify-content: center; gap: .4rem; margin: 0 auto .35rem; }
.single .tasknav { display: flex; }
.tasknav .tnav { min-height: 2rem; padding: .1rem .85rem; font-size: .9rem; border-radius: 999px; }
.tasknav .tnav.on { background: var(--base); color: #fff; border-color: var(--base); }
.cardsheet .practise { padding-top: 8px; }
@media (max-height: 700px) {
  .tasknav { margin-bottom: .1rem; }
  .tasknav .tnav { min-height: 1.75rem; font-size: .85rem; }
  .cardstage { padding-top: 0; }
  .cardsheet .tcard .cardhead { margin-top: 0; }
  .tcard .hint { margin-bottom: .2rem; }
  .cardnav { margin-top: .3rem; }
}
@media (max-height: 700px) and (min-width: 900px) { .tcard.side .ascene { max-height: 8.6rem; } .tcard.info .figwrap svg { max-height: 14.5rem; width: auto; max-width: 100%; } }
@media (max-height: 700px) { .tcard .cardplay { margin-top: 0; } .cardnav { margin-top: .15rem; } .tcard.side .exwrap { margin-bottom: 0; } }
@media (max-width: 600px) {
  .tasknav { gap: .3rem; }
  .tasknav .tnav { padding: .1rem .55rem; font-size: .82rem; }
  .single .practise [data-type^="listen-"] .opts.pics { flex-direction: row; flex-wrap: nowrap; justify-content: center; }
  .single .practise [data-type^="listen-"] .opts.pics .opt.pick.pic { flex: none; width: 46%; max-width: 46%; }
  .single .practise [data-type^="listen-"] .opt.pick.pic .rfig { max-width: none; width: 100%; }
}
.single .practise [data-type^="listen-"] .opts.pics, .tcard [class*="ex-listen-"] .opts.pics { width: 100%; justify-content: center; }

(function () { var G = globalThis; G.TA = G.TA || {}; G.TA.DATA = {"_about": "Lessons 1 to 12 of the Music Theory workbook, for the Theory Practice app. Every student-facing string here is copied from Isaac's lesson files (Source files/lessonNN.json and the captions and hints inside lessonNN.py, 2 November 2026). Do not reword them. A string the app needs that is not here goes in src/strings.js and passes tests/lint. 'introduces' lists the ideas a lesson teaches; a lesson may use only ideas introduced by itself or an earlier lesson (src/00-core.js TA.allowed). 'items' is the number of exercises in one practice set (the book's count, minus its old model answer where it had one). 'appItems' is how many the app gives for that task (Isaac, 2 November 2026: 10 for every task). 'appInstruction' is the instruction with only the verb changed for the app (Select, not Write), like 'appHeading'.", "version": "2026-11-02", "lintExceptions": {"_about": "Book wording that breaks a lint rule. The app keeps the book's words until Isaac decides (asked 2 November 2026). tests/check.js lists these as 'waiting on Isaac' and does not fail on them. Remove a line once he has answered, and change the text in both the book and here if he rewords it.", "A stave has five lines": "Lesson 1 info starts with the article A (the A rule, 12 October)", "A clef at the start": "Lesson 2 info", "A dot either side of line 4": "Lesson 2 bass clef step 4", "A tune moves by": "Lesson 5 info", "A note is an oval": "Lesson 7 info", "A and G can each go in two places": "Lesson 10 Task 3: starts with the note A", "A stem reaches about three": "Isaac's Lesson 14 wording (2 November 2026)", "A flag always goes on the": "Isaac's Lesson 14 wording (2 November 2026)", "A stem can point up or down": "Isaac's Lesson 14 wording (2 November 2026)", "A flag?": "Isaac's Lesson 14 wording (2 November 2026)", "whole note": "Isaac's Lesson 14 wording (2 November 2026)", "half note": "Isaac's Lesson 14 wording (2 November 2026)", "quarter note": "Isaac's Lesson 14 wording (2 November 2026)", "eighth note": "Isaac's Lesson 14 wording (2 November 2026)", "A flag always goes": "Isaac's Lesson 14 wording (2 November 2026)"}, "lessons": [{"n": 1, "title": "The stave", "introduces": ["stave", "line-space", "line-number", "space-number"], "learn": {"text": "A **stave** has **five lines** and **four spaces**, counted from the bottom up. Every note sits either **on a line** or **in a space**.", "diagram": "A stave with no clef. Lines numbered Line 1 to Line 5 and spaces Space 1 to Space 4, counted from the bottom, with the caption 'count up from the bottom'. One line note and one space note labelled 'Line note' and 'Space note'.", "worked": [{"task": "t1", "head": "Task 1: line or space?", "hint": "Is there a line going through it (line) or does it sit between the lines (space)?"}, {"task": "t2", "head": "Task 2: which line?", "hint": "Count up from line 1."}, {"task": "t3", "head": "Task 3: which space?", "hint": "Count up from space 1."}, {"task": "t4", "head": "Listening: same or different?", "hint": "Listen to both notes. Do they sound the same, or does the second one sound different?", "appOnly": true}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Line or space?", "instruction": "Write **line** or **space** in the box under each note.", "appInstruction": "Select **line** or **space** for each note.", "type": "line-or-space", "items": 8, "appItems": 10, "clef": null}, {"id": "t2", "number": 2, "heading": "Which line?", "instruction": "Write the line number (1 to 5).", "appInstruction": "Select the line number (1 to 5).", "type": "which-line", "items": 5, "appItems": 10, "clef": null}, {"id": "t3", "number": 3, "heading": "Which space?", "instruction": "Write the space number (1 to 4).", "appInstruction": "Select the space number (1 to 4).", "type": "which-space", "items": 5, "appItems": 10, "clef": null}, {"id": "t4", "number": 4, "listening": true, "heading": "Same or different?", "instruction": "Listen to the two notes. Select same or different.", "type": "listen-same", "items": 10, "appItems": 10, "note": "App only (Isaac, 8 November 2026): the Listening Activity at the end of the lesson. Not on the book page, so these words are the app's."}]}, {"n": 2, "title": "Clefs", "introduces": ["clef-treble", "clef-bass"], "learn": {"text": "A **clef** at the start of every stave tells you which note each line stands for.", "diagram": "Two panels. Treble clef: a printed treble clef with line 2 highlighted, a note on line 2 and the letter G beside the stave; title 'Treble clef'; caption 'The curl wraps around line 2, so line 2 is G. For higher sounds.' Bass clef: a printed bass clef with line 4 highlighted, a note on line 4 and the letter F; title 'Bass clef'; caption 'The dots sit either side of line 4, so line 4 is F. For lower sounds.'", "worked": [{"task": "t1", "head": "Treble clef", "steps": ["Dot just below line 2", "Up to line 3, curve round", "Down to line 1, curve round", "Curl up high and hook over", "Down the middle to a blob"], "note": "Animate the hand-drawn clef one stroke at a time (curriculum/clef-strokes.json), the new stroke in red."}, {"task": "t2", "head": "Bass clef", "steps": ["Big dot on line 4", "Curve up over line 5", "Sweep down past line 2", "A dot either side of line 4"], "note": "As above."}, {"task": "t3", "head": "Listening: how many notes?", "hint": "Count each note as it sounds. Play it again if you need to.", "appOnly": true}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Trace these two treble clefs, then draw 5 more", "appHeading": "Place and size these treble clefs", "type": "place-clef", "clef": "treble", "items": 7, "appItems": 10, "traced": 2, "note": "Isaac (2 November): students drag a clef from a bank onto the stave and resize it; marked on how close it is to the right place and size. The first 2 items show a faint clef to cover (the 'trace'); the rest have no guide. (Drawing freehand was tried on 2 and 3 f two black keys. Colour the white key on its left and write C."}, {"task": "t2", "head": "Task 2: Name the keys", "hint": "Find the nearest C. Go forwards one white key at a time up to the box."}, {"task": "t3", "head": "Task 3: Up an octave", "hint": "Go forwards through the letters until you reach the same letter again (8 in all)."}, {"task": "t4", "head": "Listening: same letter or not?", "hint": "Listen to both notes. If the second one sounds like the first, only higher, they have the same letter: it is an octave higher. If it sounds different, the letters are different.", "appOnly": true}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Colour every C and write C on it", "appHeading": "Select every C", "type": "find-key", "items": 1, "whiteKeys": 22, "target": "C", "note": "One long keyboard starting on a white key that is not C. Marked right only when every C is chosen and nothing else. App (Isaac, 6 November 2026): 10 keyboards of 15 white keys (appWhiteKeys), each starting on a letter that is not C.", "appItems": 10, "appWhiteKeys": 15}, {"id": "t2", "number": 2, "heading": "Name each key with a box", "type": "name-key", "items": 2, "whiteKeys": 11, "boxes": 4, "note": "Two keyboards of 11 white keys, each starting on a different letter, 4 boxed white keys each.", "appItems": 10, "appInstruction": "Select the letter for each key with a box."}, {"id": "t3", "number": 3, "heading": "Fill in the octave", "type": "fill-octave", "items": 4, "length": 8, "appItems": 10, "appInstruction": "Select the letters to fill in the octave."}, {"id": "t4", "number": 4, "listening": true, "heading": "Same letter or not?", "instruction": "Listen to the two notes. Select same letter or different letters.", "type": "listen-octave", "items": 10, "appItems": 10, "notes": 2, "note": "App only (Isaac, 6 November 2026): the Listening Activity at the end of each lesson. Two notes going up: the same letter an octave higher, or a different letter a step or small leap higher. Not on t   // a set of n answers from a list, shuffled, each answer at least floor(n / list) times, no run of 3
  const deal = (rng, values, n, ok) => {
    for (let t = 0; t < 500; t++) {
      const out = [];
      while (out.length < n) out.push(...rng.shuffle(values.slice()));
      const l = out.slice(0, n);
      if (!ok || ok(l)) return l;
    }
    throw new Error('could not deal answers');
  };
  const binary = (l) => P.binaryOk(l);
  const calm = (l) => P.maxRun(l) <= 2;
  // a generator from: answers (a dealt list) and one(r, answer, i) -> item; every item marked the same way
  function listening(values, okAnswers, one, opts) {
    opts = opts || {};
    return {
      make(rng, task, lesson) {
        const answers = deal(rng, values, task.items, okAnswers);
        const ex = (items) => (opts.revision ? null : (e, its) => gx.okExample(e, its));
        return TA.drawSet(rng, task.items, (r, i) => one(r, i < task.items ? answers[i] : r.pick(values.filter((v) => v !== answers[0])), task),
          (items) => P.noRepeatNeighbours(items.map((x) => x.key)) && (!opts.distinct || P.distinct(items.map((x) => x.key))), ex());
      },
      mark(item, response) {
        const correct = TA.same(String(item.answer), String(response));
        const m = { correct, feedback: correct ? gx.right(item) : gx.wrong(item) };
        if (!correct) m.first = opts.first ? opts.first(item, String(response)) : S().again;

      }

    const a = r.int(0, 8);
    let b = a;
    if (ans === 'different') do { b = r.int(0, 8); } while (Math.abs(b - a) < 2);
    return {
      type: task.type, key: a + '-' + b, show: { hear: { notes: notes([at(null, a), at(null, b)]), after: stave(null, [a, b]) } },

    const n = Number(ans), clef = r.pick(['treble', 'bass']);

    for (let i = 1; i < n; i++) { let p; do { p = pos[i - 1] + r.pick([-2, -1, 1, 2]); } while (p < 0 || p > 8); pos.push(p); }

      type: task.type, key: clef + pos.join('.'), clef, show: { hear: { notes: notes(pos.map((p) => at(clef, p))), after: stave(clef, pos) } },
      input: { kind: 'choice', options: ['2', '3', '4', '5'] }, answer: ans, explain: TA.fmt(S().countExplain, { n })

    const a = tune(r, sa), b = tune(r, sb), heard = ans === 'first' ? a : b;
    const fig = (pos) => RH.stave(clef, pos.map((p) => ({ kind: 'semibreve', pos: p, down: false })));

      type: task.type, key: a.join('.') + '/' + b.join('.'), clef,
      show: { hear: { notes: notes(heard.map((p) => at(clef, p))), after: stave(clef, heard, heard.map((p) => TA.letterAt(clef, p))) } },
      input: { kind: 'pick', options: [RH.opt('first', null, fig(a)), RH.opt('second', null, fig(b))] }, answer: ans,

  reg(9, 't4', whichTune('bass'));

    const a = ans === 'up' ? r.int(0, 7) : ans === 'down' ? r.int(1, 8) : r.int(0, 8);

    if (ans !== 'same') do { b = a + (ans === 'up' ? 1 : -1) * r.int(1, 4); } while (b < 0 || b > 8);

      type: task.type, key: a + '-' + b, show: { hear: { notes: notes([at('treble', a), at('treble', b)]), after: stave('treble', [a, b]) } },

      input: { kind: 'choice', options: ['an octave higher', 'an octave lower'] }, answer: ans,

/* Theory Practice: the drawing engine (SVG as strings). Everything is drawn in staff-space units (1 unit = the gap
 * between two lines), then scaled by the browser. y runs down the page in the SVG; "up" values (cy, ay) are measured

    .map((k) => k + '="' + D.esc(typeof o[k] === 'number' ? n2(o[k]) : o[k]) + '"').join(' ');

  D.svg = function (W, H, inner, o) {
    o = o || {};
    return '<svg ' + at({
      viewBox: '0 0 ' + n2(W) + ' ' + n2(H), class: 'st' + (o.cls ? ' ' + o.cls : ''), xmlns: 'http://www.w3.org/2000/svg',
      style: 'width:100%;max-width:calc(var(--sp,26px) * ' + n2(W * (o.scale || 1)) + ');aspect-ratio:' + n2(W) + '/' + n2(H),
      role: o.label ? 'img' : 'presentation', 'aria-label': o.label, 'aria-hidden': o.label ? undefined : 'true', 'data-w': n2(W), 'data-h': n2(H)

      } else if (st.type === 'dot') {

  };

  function bookExample(item) {
    const p = item.show.stave.notes[0].pos;
    const boxed = (pos, ans, top, x0, numbers) => {
      const sx0 = x0 + (numbers ? 1.6 : 0.2), sx1 = sx0 + 6.4, nx = sx0 + 3.6, y = D.y(top, pos);
      const bw = String(ans).length > 1 ? 5.6 : 2.6, bx = sx1 + 2.6, by = top + 0.8, bh = 2.4;
      let s = D.lines(sx0, sx1, top) + '<g class="sn">' + D.notePrinted(nx, y, C.ink) + '</g>';
      s += D.tag('rect', { x: bx, y: by, width: bw, height: bh, fill: '#fff', stroke: C.base, 'stroke-width': 0.08 });
      let a = '';
      if (numbers) numbers.filter((q) => q <= pos).forEach((q, i) => { a += D.text(String(i + 1), sx0 - 0.7, D.y(top, q) + 0.3, { size: 0.85, color: C.red, weight: 700, anchor: 'end' }); });
      a += D.arrow(nx + 1.1, y, bx - 0.15, by + bh / 2, { head: 0.55, w: 0.13 });
      a += D.text(String(ans), bx + bw / 2, by + bh / 2 + 0.55, { size: 1.6, color: C.pencil, font: 'Kalam', cls: 'handsvg' });
      return { s, a, W: bx + bw + 0.2 };
    };
    let rows;
    if (item.type === 'line-or-space') {
      const q = p <= 4 ? p + 3 : p - 3;                         // a note of the other kind, for the second row
      rows = [[p, item.answer], [q, TA.isLine(q) ? 'line' : 'space']].map(([pos, ans], i) => boxed(pos, ans, 1 + i * 6.6, 0));
      rows.q = q;
    } else {
      rows = [boxed(p, item.answer, 1.2, 0, item.type === 'which-line' ? [0, 2, 4, 6, 8] : [1, 3, 5, 7])];
    }
    const W = Math.max(...rows.map((r) => r.W)), H = rows.length * 6.6 - (rows.length > 1 ? 0.2 : -0.2);
    const svg = D.svg(W, H, rows.map((r) => r.s).join('') + '<g class="ans">' + rows.map((r) => r.a).join('') + '</g>',
      { cls: 'bookex', label: 'Worked example: the answer is ' + item.answer });
    return { html: svg, sound: (root) => [...root.querySelectorAll('.sn')].map((el, i) => ({ midi: TA.midiAt(null, i ? rows.q : p), el })),
      bind() { return { get: () => null, ready: () => false, lock() {}, clear() {}, reveal() {} }; } };
  }

  // red marks the worked examples add: counting numbers, arrows, a line through the note
  function exampleMarks(item, g) {
    const st = item.show.stave, notes = st.notes;
    const y = (p) => D.y(g.top, p);
    let s = '';
    if (item.type === 'line-or-space') {
      const p = notes[0].pos, x = g.xs[0];
      if (TA.isLine(p)) s += D.tag('line', { x1: x - 1.7, x2: x + 1.7, y1: y(p), y2: y(p), stroke: C.red, 'stroke-width': 0.14 });
      else s += D.arrow(x + 1.6, y(p + 1), x + 1.6, y(p - 1) - 0.0, { head: 0.4 }) + D.arrow(x + 1.6, y(p - 1), x + 1.6, y(p + 1), { head: 0.4 });
    } else if (item.type === 'which-line' || item.type === 'which-space') {
      const p = notes[0].pos, x = g.lineX0 + 0.1;
      const ps = item.type === 'which-line' ? [0, 2, 4, 6, 8] : [1, 3, 5, 7];
      ps.filter((q) => q <= p).forEach((q, i) => { s += D.text(String(i + 1), g.xs[0] - 2.4, y(q) + 0.28, { size: 0.9, color: C.red, weight: 700 }); });
    } else if (item.type === 'up-down' || item.type === 'step-leap') {
      const a = notes[0].pos, b = notes[1].pos;
      s += D.arrow(g.xs[0] + 1.1, y(a), g.xs[1] - 1.1, y(b), { head: 0.5 });
    }
    return s;
  }

  // ---------- tap a note: higher-note and find-letter ----------
  function tapFamily(item, task, o) {
    const st = item.show.stave, notes = st.notes;
    const g = V.staveGeom(st.clef, notes.length, { slot: notes.length === 2 ? 4.4 : 3.6, right: 0.6, W: notes.length === 2 ? 11 : undefined });
    let s = V.staveBase(st.clef, g);
    notes.forEach((n, i) => { s += V.noteShape(n, g.xs[i], g); });
    const ex = o.mode === 'example';
    notes.forEach((n, i) => { s += D.tag('rect', { x: g.xs[i] - 1.5, y: D.y(g.top, n.pos) - 1.4, width: 3, height: 2.8, fill: 'transparent', class: 'tap', 'data-i': i, tabindex: ex ? undefined : 0, role: ex ? undefined : 'button', 'aria-label': ex ? undefined : 'Note ' + (i + 1) }); });
    s += '<g class="sel"></g>';
    if (ex) s += '<g class="ans">' + D.oval(g.xs[item.answer], D.y(g.top, notes[item.answer].pos), 1.35, 0.95, { color: C.pencil, w: 0.13 }) + '</g>';
    const prompt = item.type === 'find-letter' ? '<div class="prompt-letter">' + esc(item.letter) + '</div>' : '';
    return {
      html: D.svg(g.W, g.H, s, { label: 'Stave with ' + notes.length + ' notes' }) + prompt,
      sound: (root) => V.staveSound(root, st),
      bind(root, ctl) {
        let locked = false;
        const svg = root.querySelector('svg'), sel = svg.querySelector('.sel');
        const circle = (i, cls) => { sel.innerHTML = D.oval(g.xs[i], D.y(g.top, notes[i].pos), 1.35, 0.95, { color: C.pencil, w: 0.13 }); };
        const pick = (i) => { if (locked) return; circle(i); ctl.answer(i); };
        svg.querySelectorAll('.tap').forEach((r) => {
          r.addEventListener('click', () => pick(Number(r.dataset.i)));
          r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(Number(r.dataset.i)); } });
        });
        return { get: () => null, ready: () => false, lock: (on) => { locked = !!on; }, clear: () => { sel.innerHTML = ''; }, reveal: () => circle(item.answer) };
      }
    };
  }

  // ---------- name the note, or the notes of a word: letters in boxes under the stave ----------
  function boxFamily(item, task, o) {
    const sts = item.show.stave, notes = sts.notes, n = notes.length;
    const single = n === 1;
    const g = V.staveGeom(sts.clef, n, { slot: single ? 4 : 2.9, right: single ? 3 : 0.6 });
    let s = V.staveBase(sts.clef, g);
    notes.forEach((nt, i) => { s += V.noteShape(nt, g.xs[i], g); });
    const ex = o.mode === 'example';
    const wide = item.answer[0].length > 1;
    if (ex) s += '<g class="ans">' + countMarks(item, g) + '</g>';
    let boxes = '';
    notes.forEach((nt, i) => { boxes += '<div class="bx" style="left:' + pct(g.xs[i], g.W) + '">' + box(i, { max: wide ? 2 : 1, cls: wide ? 'wide' : '', label: 'Note ' + (i + 1) + ' letter', value: ex ? item.answer[i] : '' }) + '</div>'; });
    return {
      html: '<div class="stavebox" style="max-width:calc(var(--sp,26px) * ' + g.W + ')">' + D.svg(g.W, g.H, s, { label: 'Stave with ' + n + (single ? ' note' : ' notes') }) + '<div class="boxrow">' + boxes + '</div></div>' +
        (ex ? '' : padHtml(wide ? OCTAVES : null)),
      needsCheck: true,
      sound: (root) => V.staveSound(root, sts),
      bind(root, ctl) { return wirePad(root, ctl); }
    };
  }
  // the red letters the book writes while counting up from the bottom line
  function countMarks(item, g) {
    if (item.type === 'hidden-word') return '';
    const clef = item.show.stave.clef, p = item.show.stave.notes[0].pos;
    let s = '';
    for (let q = 0; q <= p; q++) s += D.text(TA.noteName(TA.noteAt(clef, q)).replace(/[0-9]/g, ''), g.xs[0] - 1.65, D.y(g.top, q) + 0.3, { size: 0.85, color: C.red, weight: 700 });
    return s;
  }

  // ---------- rows of letters (Lessons 3 and 4) ----------
  // The arrow and its label are the book's own, over Tasks 1 and 2 (going up, going down). Fill the gaps has none
  // in practice, so nothing shows the direction (RULES 4.6). Students can type a letter or select it from the letter
  // buttons under the row (Isaac, 6 November 2026: Select, not Write).
  const rowArrow = (dir, label) => '<div class="rowhead"><svg class="rowarrow" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><line x1="' + (dir === 1 ? 4 : 96) + '" x2="' + (dir === 1 ? 94 : 6) + '" y1="3" y2="3" stroke="' + C.base + '" stroke-width="1.2"/>' +
      '<path d="' + (dir === 1 ? 'M97 3 L92 0.5 L92 5.5 Z' : 'M3 3 L8 0.5 L8 5.5 Z') + '" fill="' + C.base + '"/></svg>' + (label ? '<span class="rowlab">' + esc(label) + '</span>' : '') + '</div>';
  // the letter buttons A to G and Undo under a row of boxes (RULES 8.6, 8.10), and their wiring
  const OCTAVES = ['2', '3', '4', '5'];                     // the octave numbers Lessons 11 and 12 use (C2 to B5)
  const padHtml = (nums) => '<div class="letterpad' + (nums ? ' withnums' : '') + '" role="group" aria-label="Letters"><span class="lpl">' + TA.LETTERS.map((l) => '<button type="button" class="btn lp" data-l="' + l + '">' + l + '</button>').join('') + '</span>' +
      (nums ? '<span class="lpl lpn">' + nums.map((d) => '<button type="button" class="btn lp octn" data-l="' + d + '">' + d + '</button>').join('') + '</span>' : '') +
      '<button type="button" class="btn undo" disabled aria-label="' + esc(ST().undo) + '"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>' + esc(ST().undo) + '</span></button></div>';
  function wirePad(root, ctl) {
    const undo = root.querySelector('.letterpad .undo');
    const w = wireBoxes(root, ctl, { pad: true, onHistory: (any) => { if (undo) undo.disabled = !any; } });
    if (undo) {
      undo.addEventListener('pointerdown', (e) => e.preventDefault());
      undo.addEventListener('click', () => w.undo());
    }
    // on a phone the letter buttons are the keyboard, so the phone's own keyboard stays down
    root.querySelectorAll('input.box:not([readonly])').forEach((b) => b.setAttribute('inputmode', 'none'));
    root.querySelectorAll('.lp').forEach((b) => {
      b.addEventListener('pointerdown', (e) => e.preventDefault());      // keep the box selected
      b.addEventListener('click', () => { if (!b.disabled) w.pad(b.dataset.l); });
    });
    const lock = w.lock;
    w.lock = (on) => { lock(on); root.querySelectorAll('.lp, .letterpad .undo').forEach((b) => { b.disabled = !!on; }); if (!on && undo) undo.disabled = true; };
    return w;
  }
  // the MIDI number of a white key { letter, octave }
  const keyMidi = (k) => TA.midiOf(k.letter, k.octave);
  // a small keyboard of the white keys from one letter up to the same letter (Lesson 4 Task 3, after it is answered)
  const octaveKeys = (start) => TA.whiteKeys(start + ('AB'.includes(start) ? 3 : 4), 8);

  function lettersFamily(item, task, o) {
    const row = item.show.letters, ex = o.mode === 'example';
    let cells = '', k = 0;
    row.forEach((l, i) => {
      if (l) cells += '<div class="cell fixed">' + esc(l) + '</div>';
      else cells += '<div class="cell">' + box(k++, { label: 'Letter ' + (i + 1), value: ex ? item.answer[k - 1] : '' }) + '</div>';
    });
    const booky = task.type === 'next-letter';
    const arrow = ex || booky ? rowArrow(item.direction, booky ? (item.direction === 1 ? 'going up' : 'going down') : '') : '';
    const pad = ex ? '' : padHtml();
    // Lesson 4 Task 3: once it is answered, the octave's keys appear under the row and light up with their boxes
    const okb = task.type === 'fill-octave' && !ex ? '<div class="okb" hidden>' + V.keyboard({ keys: octaveKeys(row[0]) }, { mode: 'static', minKey: 10, cls: 'mini' }) + '</div>' : '';
    return {
      html: '<div class="rowwrap">' + arrow + '<div class="letters">' + cells + '</div>' + okb + '</div>' + pad, needsCheck: true,
      bind(root, ctl) {
        const w = wirePad(root, ctl);
        if (okb) { const lock = w.lock; w.lock = (on) => { lock(on); if (on) root.querySelector('.okb').hidden = false; }; }
        return w;
      },
      // what it sounds like: the whole row, with the answer in place, each box lit as its letter sounds (and its key)
      sound(root) {
        let k2 = 0;
        const full = row.map((l) => l || item.answer[k2++]);
        const els = [...root.querySelectorAll('.letters .cell')];
        const kb = root.querySelector('.okb:not([hidden])'), keys = kb ? [...kb.querySelectorAll('.wk')] : [];
        return TA.letterPitches(full, item.direction).map((m, i) => ({ midi: m, el: keys[i] ? [els[i], keys[i]] : els[i] }));
      }
    };
  }

  // ---------- listening (Isaac, 6 November 2026) ----------
  // Empty boxes, one for each note, light up as the notes play. The letters appear once it is answered. The answer
  // buttons wait until the notes have been heard once.
  function listenFamily(item, task, o) {
    const L = item.show.listen, ex = o.mode === 'example';
    const cells = L.letters.map((l) => '<div class="cell lcell"><span class="ll' + (ex ? ' hand' : '') + '">' + (ex ? esc(l) : '') + '</span></div>').join('');
    const opts = item.input.options.map((v) => btn(v.charAt(0).toUpperCase() + v.slice(1), v, ex && TA.same(v, item.answer) ? 'pen' : '')).join('');
    const playBtn = '<button type="button" class="btn playbtn"><span class="spk" aria-hidden="true">' + speaker() + '</span><span class="pl">' + esc(ST().listen.play) + '</span></button>';
    // Lesson 4: once it is answered, the two keys appear on a keyboard (the C below the first note up to the second)
    let lkb = '', lkeys = null;
    if (L.keys) {
      const lo = TA.noteFromMidi(L.pitches[0]), hi = TA.noteFromMidi(L.pitches[L.pitches.length - 1]);
      lkeys = TA.whiteKeys('C' + lo.octave, TA.dia(hi.letter, hi.octave) - TA.dia('C', lo.octave) + 1 + (hi.letter === 'B' ? 0 : 1));
      const at = [lo, hi].map((n) => lkeys.findIndex((k) => k.letter === n.letter && k.octave === n.octave));
      lkb = '<div class="lkb"' + (ex ? '' : ' hidden') + ' data-at="' + at.join(' ') + '">' + V.keyboard({ keys: lkeys }, { mode: 'static', minKey: 10, cls: 'mini' }) + '</div>';
    }
    const markKeys = (root) => {
      const host = root.querySelector('.lkb');
      if (!host) return;
      const ws = host.querySelectorAll('.wk');
      host.dataset.at.split(' ').forEach((i, k) => { const el = ws[Number(i)]; el.classList.add('on'); el.querySelector('.mark').textContent = L.letters[k]; });
    };
    return {
      html: '<div class="listen">' + playBtn + '<div class="letters">' + cells + '</div></div>' + lkb + '<div class="opts">' + opts + '</div>',
      mountExample: markKeys,
      autoplay: true,
      bind(root, ctl) {
        let locked = false, heard = !TA.sound.on;
        const opts2 = [...root.querySelectorAll('button.opt')];
        const gate = () => opts2.forEach((b) => { b.disabled = locked || !heard; });
        const play = () => {
          TA.sound.unlock();
          root.querySelector('.playbtn .pl').textContent = ST().listen.again;
          return TA.sound.play(this.sound(root)).then(() => { heard = true; gate(); if (ctl.heard) ctl.heard(); });
        };
        root.querySelector('.playbtn').addEventListener('click', play);
        opts2.forEach((b) => b.addEventListener('click', () => {
          if (locked || !heard) return;
          opts2.forEach((x) => x.classList.toggle('chosen', x === b));
          ctl.answer(b.dataset.v);
        }));
        gate();
        return {
          get: () => null, ready: () => false, play,
          lock: (on) => {
            locked = !!on; gate();
            if (!on) return;
            root.querySelectorAll('.ll').forEach((s, i) => { s.textContent = L.letters[i]; s.classList.add('hand'); });
            const host = root.querySelector('.lkb');
            if (host) { host.hidden = false; markKeys(root); }
          },
          clear: () => opts2.forEach((x) => x.classList.remove('chosen')),
          reveal: () => opts2.forEach((x) => x.classList.toggle('pen', TA.same(x.dataset.v, item.answer)))
        };
      },
      sound(root) {
        const els = [...root.querySelectorAll('.lcell')];
        const host = root.querySelector('.lkb:not([hidden])'), ws = host ? host.querySelectorAll('.wk') : null;
        const at = host ? host.dataset.at.split(' ').map(Number) : [];
        return L.pitches.map((m, i) => ({ midi: m, el: ws ? [els[i], ws[at[i]]] : els[i] }));
      }
    };
  }
  function speaker() {
    return '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  }
  V.speaker = speaker;

  // ---------- the keyboard ----------
  // kb = { keys, boxes, given, octaveLabels }; mode 'tap' toggles keys; 'boxes' puts a box on each boxed key
  V.keyboard = function (kb, o) {
    o = o || {};
    const keys = kb.keys, N = keys.length;
    const width = o.width || Math.min((document.documentElement.clientWidth || 800) - 56, 1100);
    const minKey = o.minKey || 24;
    let rows = 1;
    while (rows < 8 && width / Math.ceil(N / rows) < minKey) rows *= 2;
    const per = Math.ceil(N / rows);
    let html = '';
    for (let r = 0; r < rows; r++) {
      const a = r * per, b = Math.min(N, a + per), n = b - a;
      if (n <= 0) continue;
      let whites = '', blacks = '';
      for (let i = a; i < b; i++) {
        const k = keys[i], j = i - a;
        const boxed = (kb.boxes || []).includes(i);
        const given = kb.given && kb.given[i];
        const label = given ? '<span class="klab hand' + (given === 'C4' ? ' b' : '') + '">' + esc(given) + '</span>' :
          (kb.octaveLabels && k.letter === 'C' ? '<span class="klab oct">' + esc(TA.noteName(k)) + '</span>' : (o.letters ? '<span class="klab">' + esc(k.letter) + '</span>' : ''));
        whites += '<div class="wk' + (o.mode === 'tap' ? ' tapkey' : '') + (boxed ? ' boxed' : '') + '" data-i="' + i + '"' + (o.mode === 'tap' ? ' tabindex="0" role="button" aria-label="Key ' + (i + 1) + '"' : '') + '>' +
          (boxed ? '<div class="kb-bx">' + box(i, { max: kb.octaveLabels ? 2 : 1, cls: kb.octaveLabels ? 'wide' : '', label: 'Key ' + (i + 1), value: o.values ? o.values[i] : '' }) + '</div>' : label) + '<span class="mark hand"></span></div>';
        if (TA.hasBlackRight(k.letter) && j < n - 1) blacks += '<div class="bk" style="left:calc(' + ((j + 1) / n * 100) + '% - ' + (0.3 / n * 100) + '%);width:' + (0.6 / n * 100) + '%"></div>';
      }
      html += '<div class="kbrow" style="--n:' + n + ';aspect-ratio:' + n + '/' + (n < 9 ? 4.2 : 4.6) + '">' + whites + blacks + '</div>';
    }
    return '<div class="kb' + (o.cls ? ' ' + o.cls : '') + '" role="group" aria-label="Keyboard">' + html + '</div>';
  };

  function keyFamily(item, task, o) {
    const kb = item.show.keyboard, ex = o.mode === 'example';
    const tap = item.input.kind === 'keys';
    const vals = {};
    if (ex && !tap) (kb.boxes || []).forEach((i, k) => { vals[i] = item.answer[k]; });
    const padded = !tap && !ex;                                       // letter buttons and Undo (RULES 8.6); Lesson 11 adds octave numbers
    const html = V.keyboard(kb, { mode: tap ? 'tap' : 'boxes', minKey: tap ? 14 : kb.octaveLabels ? 40 : 24, values: vals }) + (padded ? padHtml(kb.octaveLabels ? OCTAVES : null) : '');
    return {
      html, needsCheck: true,
      // what it sounds like (Isaac, 6 November 2026): Lesson 4 Task 1 plays every C, the others the boxed keys, low to
      // high, each key lit as it sounds
      sound: function (root) {
        const ws = [...root.querySelectorAll('.wk')];
        const at = tap ? item.answer : kb.boxes;
        return at.map((i) => ({ midi: keyMidi(kb.keys[i]), el: ws[i] }));
      },
      bind(root, ctl) {
        const keysEl = [...root.querySelectorAll('.wk')];
        if (tap) {
          const on = new Set();
          let locked = false;
          const toggle = (el) => {
            if (locked) return;
            const i = Number(el.dataset.i);
            if (on.has(i)) { on.delete(i); el.classList.remove('on'); el.querySelector('.mark').textContent = ''; }
            else { on.add(i); el.classList.add('on'); el.querySelector('.mark').textContent = 'C'; }
            ctl.change();
          };
          keysEl.forEach((el) => { el.addEventListener('click', () => toggle(el)); el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(el); } }); });
          return {
            get: () => [...on].sort((a, b) => a - b), ready: () => on.size > 0, lock: (v) => { locked = !!v; }, clear: () => { on.clear(); keysEl.forEach((el) => { el.classList.remove('on', 'ans'); el.querySelector('.mark').textContent = ''; }); },
            reveal: () => item.answer.forEach((i) => { keysEl[i].classList.add('ans'); })
          };
        }
        return padded ? wirePad(root, ctl) : wireBoxes(root, ctl);
      }
    };
  }
  // the example for find-key colours the Cs
  V.markKeys = function (root, item) { root.querySelectorAll('.wk').forEach((el) => { if (item.answer.includes(Number(el.dataset.i))) { el.classList.add('on'); el.querySelector('.mark').textContent = 'C'; } }); };

  // ---------- clear-note: tick or cross ----------
  function tickFamily(item, task, o) {
    const n = item.show.stave.notes[0], g = V.staveGeom(null, 1, { W: 8 });
    const s = V.staveBase(null, g) + V.noteShape(n, g.xs[0], g);
    const ex = o.mode === 'example';
    return {
      html: D.svg(g.W, g.H, s, { label: 'A stave with a note drawn in pencil' }) + '<div class="opts">' +
        '<button type="button" class="btn opt mark-btn' + (ex && item.answer === 'tick' ? ' pen' : '') + '" data-v="tick" aria-label="Tick">' + markSvg('tick') + '</button>' +
        '<button type="button" class="btn opt mark-btn' + (ex && item.answer === 'cross' ? ' pen' : '') + '" data-v="cross" aria-label="Cross">' + markSvg('cross') + '</button></div>',
      sound: (root) => V.staveSound(root, { clef: 'treble', notes: [n] }),
      bind(root, ctl) {
        let locked = false;

/* ---- ui/50-progress.js ---- */
/* Theory Practice: progress (RULES 5.5). Each lesson's best and latest first-try score and the date are kept in the
 * browser (localStorage, always inside try/catch: it can be empty or blocked). Send my results opens Isaac's Google
 * Form pre-filled, the way Sight Singer's Send my progress does. Nothing is sent unless the student presses Submit. */
(function (G) {
  'use strict';
  const TA = G.TA;
  const KEY = 'tawa-theory-practice-v1';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // The form address and its entry ids go here, in one place. Until Isaac makes the form this stays null and the
  // Send my results button is hidden. Form: a "Results" paragraph question and an "App version" short-answer
  // question, with "Collect email addresses: Verified" on. Example:
  //   { url: 'https://docs.google.com/forms/d/e/FORM_ID/viewform', results: 'entry.1111111111', version: 'entry.2222222222' }
  TA.RESULTS_FORM = null;
  TA.APP_VERSION = 'Theory Practice 1.0, Lessons 1 to 12, 2 Nov 2026';

  let memory = { lessons: {} };                              // used when the browser will not store anything
  const read = () => {
    try { const raw = G.localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.lessons) return d; } } catch (e) { /* blocked or empty */ }
    return memory;
  };
  const write = (d) => { memory = d; try { G.localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } };

  const P = (TA.progress = {});
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  P.dateText = (iso) => { const m = /^(\d+)-(\d+)-(\d+)$/.exec(iso || ''); return m ? Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] : ''; };
  P.get = (n) => read().lessons[n] || null;
  P.record = function (n, got, total) {
    const d = read();
    const prev = d.lessons[n] || {};
    const now = { got, total, date: today() };
    const better = !prev.best || got / total >= prev.best.got / prev.best.total;
    d.lessons[n] = { latest: now, best: better ? now : prev.best };
    return write(d);
  };
  P.line = function (n) {
    const r = P.get(n);
    return r ? 'Latest ' + r.latest.got + '/' + r.latest.total + ', best ' + r.best.got + '/' + r.best.total : '';
  };
  // one line for each lesson that has a score: "Lesson 6 Treble clef notes: best 15/16, last 13/16, 2 Nov"
  P.resultsText = function () {
    const out = [];
    TA.DATA.lessons.forEach((L) => {
      const r = P.get(L.n);
      if (r) out.push('Lesson ' + L.n + ' ' + L.title + ': best ' + r.best.got + '/' + r.best.total + ', last ' + r.latest.got + '/' + r.latest.total + ', ' + P.dateText(r.latest.date));
    });
    return out.join('\n');
  };
  P.canSend = () => !!TA.RESULTS_FORM && !!P.resultsText();
  P.send = function () {
    const F = TA.RESULTS_FORM;
    if (!F) return false;
    const q = 'usp=pp_url&' + encodeURIComponent(F.results) + '=' + encodeURIComponent(P.resultsText()) + '&' + encodeURIComponent(F.version) + '=' + encodeURIComponent(TA.APP_VERSION);
    G.open(F.url + '?' + q, '_blank', 'noopener');
    return true;
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---- ui/90-app.js ---- */
/* Theory Practice: the app shell. Home, and each lesson's one screen: its cards and its questions together (RULES 8.2).
 * #/lesson/N/learn/K still shows card K on its own (for the projector and tests/screens.js). TA.ui is for the tests. */
(function (G) {
  'use strict';
  const TA = G.TA;
  const D = TA.draw;
  const S = () => TA.STRINGS;
  const UI = (TA.ui = {});
  let app, cur = { screen: 'home' };

  const E = D.esc;

  const banner = (eyebrow, title, corner) => '<header class="banner"><div><div class="eyebrow">' + E(eyebrow) + '</div><h1>' + E(title) + '</h1></div>' + (corner || '') + '</header>';
  const footer = () => '<footer>' + E(S().app.school) + ' &nbsp;|&nbsp; Music Theory &nbsp;|&nbsp; <b>' + E(S().app.name) + '</b></footer>';

  const soundBtn = () => (TA.sound.available() ? '<button type="button" class="helpbtn sndbtn" aria-pressed="' + TA.sound.on + '">' + E(TA.sound.on ? S().sound.on : S().sound.off) + '</button>' : '');

    const b = root.querySelector('.sndbtn');

  }

  // ---------- screens ----------
  function home() {
    let list = '';

    });
    const send = TA.progress.canSend() ? '<button type="button" class="btn solid send">' + E(S().results.send) + '</button>' : '';
    return {
      html: '<div class="sheet">' + banner(S().app.school, S().app.name) + '<section class="frame home"><p class="label">' + E(S().home.part1) + '</p><h2 class="lessonshead">' + E(S().home.lessons) + '</h2><ol class="lessons">' + list + '</ol>' + send + '</section>' + footer() + '</div>',
      mount() { const b = app.querySelector('.send'); if (b) b.addEventListener('click', () => TA.progress.send()); }
    };
  }
  function learn(n, step) {
    const total = UI.learnSteps(n), s = Math.max(0, Math.min(total - 1, step));
    const L = lessonOf(n), r = TA.learn.card(n, s);
    const last = s === total - 1;
    const nav = '<nav class="learnnav"><button type="button" class="btn prev"' + (s === 0 ? ' disabled' : '') + '>' + E(S().lesson.previous) + '</button>' +
      '<span class="count">' + (s + 1) + ' / ' + total + '</span>' +
      (last ? '<a class="btn solid" href="#/lesson/' + n + '/practise">' + E(S().lesson.start) + '</a>' : '<button type="button" class="btn solid next">' + E(S().lesson.next) + '</button>') + '</nav>';
    return {
      html: '<div class="sheet learnsheet cardsheet">' + banner('Music theory · Lesson ' + n, L.title, '<div class="cornerrow">' + soundBtn() + '<a class="corner" href="#/lesson/' + n + '">' + E('Lesson ' + n) + '</a></div>') + '<section class="frame">' + r.html + '</section>' + nav + footer() + '</div>',
      mount(root) {
        wireSound(root);
        const rc = r.mount(root);
        if (rc && rc.play && s > 0) rc.play();
        const go = (d) => UI.go('#/lesson/' + n + '/learn/' + (s + 1 + d));
        const p = root.querySelector('.prev'), x = root.querySelector('.next');
        if (p) p.addEventListener('click', () => go(-1));
        if (x) x.addEventListener('click', () => go(1));
        cur.keys = (e) => {
          if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
          if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (s < total - 1) go(1); else UI.go('#/lesson/' + n + '/practise'); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); if (s > 0) go(-1); }

  function practise(n, seed) {
    const L = lessonOf(n), r = TA.practise.render(n, seed);
    return {
      html: '<div class="sheet practisesheet cardsheet">' + banner('Music theory · Lesson ' + n, L.title, '<div class="cornerrow"><a class="helpbtn homebtn" href="#/">' + E(S().home.home) + '</a>' + soundBtn() + '<button type="button" class="helpbtn">' + E(S().card.open) + '</button><div class="corner scorebox"><span class="slab">' + E(S().marking.score) + '</span><b class="sc">0 / 0</b></div></div>') +
        '<dialog class="helpdlg" aria-label="' + E(S().card.title) + '"><div class="helpbody"></div><div class="helpfoot"><button type="button" class="btn solid helpclose" autofocus>' + E(S().card.close) + '</button></div></dialog>' +
        '<section class="frame practise">' + r.html + '</section>' + footer() + '</div>',
      mount(root) {
        let task = null, onCard = null, dctl = null;
        const dlg = root.querySelector('.helpdlg'), body = root.querySelector('.helpbody');
        wireSound(root);
        const openDlg = () => { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); };
        const closeDlg = () => { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); };
        // a card lesson's Show me how opens the card of the task the student is on (or the card showing)
        const openCard = (id, o) => {
          o = o || {};
          TA.sound.unlock();
          const k = id ? L.tasks.findIndex((t) => t.id === id) + 1 : 0;
          const c = TA.learn.card(n, k);
          body.innerHTML = (o.rushed ? '<p class="rushed">' + E(S().card.rushed) + '</p>' : '') + c.html;
          openDlg();
          dctl = c.mount(body) || null;
          if (dctl && dctl.play && k) dctl.play();
        };
        root.querySelector('.helpbtn:not(.sndbtn):not(.homebtn)').addEventListener('click', () => openCard(onCard === null ? task : (onCard ? L.tasks[onCard - 1].id : null)));
        root.querySelector('.helpclose').addEventListener('click', closeDlg);
        dlg.addEventListener('click', (e) => { if (e.target === dlg && dlg.close) dlg.close(); });

    const n = Number(m[1]);
    if (m[2] === 'learn' && lessonOf(n).learn) return { screen: 'learn', lesson: n, step: Math.max(0, Number(m[3] || 1) - 1) };

  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---- ui/95-fit.js ---- */
/* Theory Practice: fit the screen to the window (Isaac, 4 November 2026: "the entire interface, as much as possible,
 * can be seen without scrolling"). On the Learn screens and on Practise (one question at a time), when the page runs
 * past the bottom of the window, the diagrams of what is showing (staves, keyboards, pictures) are made narrower, and so
 * shorter, until it fits. They never go below MIN of their natural size, so a stave stays big enough to tap; past that
 * the page scrolls. Runs after a screen is drawn, after each question appears or is marked, and when the window
 * changes size. */
(function (G) {
  'use strict';
  const TA = G.TA;
  const F = (TA.fit = {});
  const MIN = 0.4;                       // a diagram is never made smaller than this share of its natural width
  // ... and never smaller than a staff space of 12 px (RULES 6.7), or 14 px on a stave you drag pieces onto, so a
  // tap or a drag can still land on a line or a space
  const minWidth = (el, natural) => {
    // a keyboard: never less than 22 px a white key, so each key can still be tapped (Lesson 4, 6 November 2026)
    if (el.matches && el.matches('.kb')) { const row = el.querySelector('.kbrow'); return Math.min(natural, Math.max(natural * MIN, (row ? row.querySelectorAll('.wk').length : 0) * 22)); }
    const sp = el.matches && el.matches('svg.draw') ? 14 : 12, w = Number(el.getAttribute && el.getAttribute('data-w')) || 0;
    return Math.min(natural, Math.max(natural * MIN, w * sp));
  };

  const visible = (el) => !!(el.offsetParent || el.getClientRects().length) && !el.closest('[hidden], dialog');
  // the diagrams to shrink: on Practise only the question showing, on Learn the whole frame
  function figures() {
    const scr = document.documentElement.dataset.screen;
    let host;
    if (scr === 'learn') host = document.querySelector('.learnsheet .frame');
    else if (scr === 'practise') {
      if (!document.querySelector('#app.single, .single')) return [];
      const stage = document.querySelector('.practise .cardstage:not([hidden])');      // a task card (RULES 8.2)
      host = stage || [...document.querySelectorAll('.practise .item')].find((c) => !c.hidden && visible(c));
    }
    if (!host) return [];
    // the outermost figures only (a stave inside a picture option is shrunk with the option)
    const shared = host.closest && host.closest('section.task') && host.closest('section.task').querySelector('.sharedkb .kb');   // Lesson 12 Task 3's keyboard
    const all = [...host.querySelectorAll('svg.st:not(.mk), .kb, .opts.pics')].concat(shared ? [shared] : []).filter(visible)
      .filter((el) => !(el.matches('.kb') && (el.closest('.tcard') || el.matches('.mini'))));   // keyboards with a set height (style.css) keep their size
    F.host = host;
    return all.filter((el) => !all.some((o) => o !== el && o.contains(el)));
  }
  // how far the page runs past the window: on Practise, measured from what is showing (the question or the card), as
  // the frame's own minimum height made every phone screen look too tall and shrank its pictures to nothing (Isaac,
  // 9 November 2026)
  const over = () => {
    const h = F.host;
    if (h && document.documentElement.dataset.screen === 'practise') return Math.ceil(h.getBoundingClientRect().bottom + G.scrollY + 28 - G.innerHeight);
    return document.documentElement.scrollHeight - G.innerHeight;
  };

  F.run = function () {
    const figs = figures();
    figs.forEach((el) => {                                // start from the natural size each time (keeping the diagram's own limit)
      if (!('fitMax' in el.dataset)) el.dataset.fitMax = el.style.maxWidth || '';
      el.style.maxWidth = el.dataset.fitMax;
    });
    if (!figs.length || over() <= 0) return;
    const natural = figs.map((el) => el.getBoundingClientRect().width);
    let f = 1;
    for (let i = 0; i < 6; i++) {
      const o = over();
      if (o <= 0) break;
      // the figures' combined height, counted once for figures side by side
      const rows = new Map();
      figs.forEach((el) => { const r = el.getBoundingClientRect(); const k = Math.round(r.top); rows.set(k, Math.max(rows.get(k) || 0, r.height)); });
      const tall = [...rows.values()].reduce((a, b) => a + b, 0);
      if (tall <= 0) break;
      f = Math.max(MIN, f * Math.max(0.5, (tall - o - 4) / tall));
      figs.forEach((el, k) => { el.style.maxWidth = Math.floor(Math.max(natural[k] * f, minWidth(el, natural[k]))) + 'px'; });
      if (f === MIN) break;
    }
  };
  let t = null;
  F.soon = () => { clearTimeout(t); t = setTimeout(F.run, 30); };
  G.addEventListener && G.addEventListener('resize', F.soon);
})(typeof globalThis !== 'undefined' ? globalThis : this);

TA.ui.start();
