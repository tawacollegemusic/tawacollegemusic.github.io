<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; form-action https://docs.google.com; base-uri 'none'">
<title>Theory Practice</title>
<style>
/* Theory Practice: Tawa College style, unit colour indigo (RULES 6). Lexend for headings, Fira Sans for text, Kalam for
   student work, Bravura for printed music. Fonts are served from the site (theory/fonts), not a CDN. */
@font-face { font-family: "Lexend"; src: url(theory/fonts/lexend.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url(theory/fonts/FiraSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url(theory/fonts/FiraSans-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Kalam"; src: url(theory/fonts/Kalam-Regular.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Bravura"; src: url(theory/fonts/bravura.woff2) format("woff2"); font-display: swap; }

:root { --base: #3F3D8F; --shade: #2F2E6B; --tint: #D9D8E9; --light: #B2B1D2; --red: #D8001D; --ink: #2B2B2B; --grey: #6E6E6E;
  --pencil: #4D4D4D; --divider: #B0B0B0; --page: #FFFFFF; --sp: 26px; color-scheme: light; }
@media (min-width: 1500px) { :root { --sp: 36px; } html { font-size: 21px; } }
* { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 1rem/1.5 "Fira Sans", system-ui, sans-serif; }
a { color: var(--base); }
.hand { font-family: "Kalam", cursive; color: var(--pencil); }
.mus { font-family: "Bravura"; }
svg text { font-family: "Fira Sans", sans-serif; }
svg text.mus { font-family: "Bravura"; }
.st { display: block; margin: 0 auto; overflow: visible; }

.sheet { max-width: 1120px; margin: 0 auto; padding: 18px 16px 8px; }
@media (min-width: 1500px) { .sheet { max-width: 1560px; } }
.sheet > * + * { margin-top: 16px; }

/* the banner */
.banner { background: var(--base); color: #fff; border-radius: 22px 22px 0 0; padding: 20px 26px; display: flex; gap: 16px; align-items: center; justify-content: space-between; min-height: 6.4rem; margin-bottom: -16px; }
.banner .eyebrow { font: 700 .72rem/1 "Lexend", sans-serif; letter-spacing: .22em; text-transform: uppercase; }
.banner h1 { font: 700 2rem/1.15 "Lexend", sans-serif; margin: .5rem 0 0; }
.banner .corner { background: #fff; color: var(--shade); border-radius: 12px; padding: 10px 16px; font: 600 .9rem/1.3 "Lexend", sans-serif; text-align: center; text-decoration: none; min-width: 8rem; }
.scorebox { display: flex; flex-direction: column; gap: 2px; }
.scorebox .slab { font-weight: 400; font-size: .75rem; }
.scorebox b { font: 700 1.4rem/1.1 "Lexend", sans-serif; }
.scorebox a { font-size: .8rem; font-weight: 500; margin-top: 2px; }

/* the frame: 2 pt indigo border, rounded corners, like the 13 October pages */
.frame { border: 2px solid var(--base); border-top: 0; border-radius: 0 0 22px 22px; overflow: hidden; background: #fff; margin-top: 0; }
.info { background: var(--tint); padding: 18px 26px 22px; }
.todo { background: #fff; padding: 18px 26px 24px; }
.label { font: 700 .72rem/1 "Lexend", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--shade); margin: 0 0 12px; }
.infotext { font-size: 1.15rem; margin: 0 0 6px; max-width: 60rem; }
.figwrap { margin-top: .8rem; }
.fig { margin: 0 auto; }
h2.wtd { font: 700 1.35rem/1.25 "Lexend", sans-serif; color: var(--shade); margin: 0 0 .3rem; }
.hint { margin: 0 0 .5rem; font-size: 1.1rem; max-width: 56rem; }
.instr { margin: 0 0 .6rem; }

/* Learn */
.exwrap { max-width: 900px; margin: .8rem auto .4rem; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
.exwrap .st { max-width: 100%; }
.stroke-cap { font: 500 1.2rem/1.3 "Lexend", sans-serif; color: var(--shade); text-align: center; margin: .6rem 0; }
.strokeno { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--base); color: #fff; font-size: 1rem; margin-right: .4rem; }
.dots { display: flex; justify-content: center; gap: .5rem; }
.dots .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--tint); }
.dots .dot.on { background: var(--base); }
.learnnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.learnnav .count { font: 500 1rem/1 "Lexend", sans-serif; color: var(--shade); }
.replay { margin-top: .4rem; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes appear2 { from { opacity: 0; } to { opacity: 1; } }
.example .ans, .example input.box[readonly], .example .opt.pen, .example .wk.on, .example .cell input[readonly] { animation: appear .8s ease 1.2s both; }
.example.again .ans, .example.again input.box[readonly], .example.again .opt.pen, .example.again .wk.on, .example.again .cell input[readonly] { animation-name: appear2; }
html.still .example *, html.still .example { animation: none !important; }

/* buttons */
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; font: 600 1rem/1 "Lexend", sans-serif; color: var(--base); background: #fff; border: 2px solid var(--base); border-radius: 12px; padding: .75rem 1.1rem; min-height: 2.9rem; text-decoration: none; }
.btn:hover { background: var(--tint); }
.btn.solid { background: var(--base); color: #fff; }
.btn.solid:hover { background: var(--shade); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 2.3rem; padding: .45rem .8rem; font-size: .85rem; }
.btn:focus-visible, a:focus-visible, input:focus-visible, .piece:focus-visible, .tap:focus-visible, .tapkey:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.opts { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.opt { min-width: 3.4rem; font-size: 1.05rem; }
.opt.chosen { background: var(--tint); }
.opt.pen { font-family: "Kalam", cursive; font-weight: 400; color: var(--pencil); border-color: var(--pencil); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--pencil); }
.mark-btn svg.mk { width: 1.6rem; height: 1.6rem; }

/* home and lesson menu */
.home, .lessonmenu { padding: 22px 26px 28px; }
.lessonshead { font: 700 1.5rem/1.2 "Lexend", sans-serif; color: var(--shade); margin: 0 0 .8rem; }
.lessons { list-style: none; margin: 0 0 1.2rem; padding: 0; display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); }
.lrow { display: grid; grid-template-columns: 2.6rem 1fr; grid-template-rows: auto auto; column-gap: .8rem; align-items: center; border: 2px solid var(--light); border-radius: 14px; padding: .65rem .9rem; text-decoration: none; color: var(--ink); min-height: 4rem; }
.lrow:hover { border-color: var(--base); background: var(--tint); }
.ln { grid-row: 1 / 3; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--base); color: #fff; display: grid; place-items: center; font: 700 1.1rem/1 "Lexend", sans-serif; }
.lt { font: 600 1.05rem/1.25 "Lexend", sans-serif; color: var(--shade); }
.ls { font-size: .85rem; color: var(--grey); min-height: 1.2em; }
.bigbtns { display: flex; gap: 1rem; flex-wrap: wrap; }
.bigbtn { flex: 1 1 14rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; min-height: 8rem; border: 3px solid var(--base); border-radius: 20px; text-decoration: none; color: var(--base); background: #fff; }
.bigbtn:hover { background: var(--tint); }
.bigbtn.solid { background: var(--base); color: #fff; }
.bigbtn.solid:hover { background: var(--shade); }
.bt { font: 700 1.9rem/1 "Lexend", sans-serif; }
.bs { font-size: .95rem; opacity: .85; }
.progline { margin: 1rem 0 0; color: var(--grey); }

/* practise */
.practise { padding: 18px 26px 28px; }
.before { margin: 0 0 1rem; }
section.task { margin: 0; }
hr.divide { border: 0; border-top: 2px dashed var(--divider); margin: 1.6rem 0 1.4rem; }
.th { font: 700 1.35rem/1.3 "Lexend", sans-serif; color: var(--shade); margin: 0 0 .6rem; }
.th a { color: var(--base); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cardmin, 12rem), 1fr)); gap: 1rem; }
[data-type="line-or-space"] .items, [data-type="name-note"] .items, [data-type="name-note-octave"] .items, [data-type="clear-note"] .items { --cardmin: 11.5rem; }
[data-type="which-line"] .items, [data-type="which-space"] .items { --cardmin: 11rem; }
[data-type="higher-note"] .items, [data-type="up-down"] .items, [data-type="step-leap"] .items, [data-type="find-letter"] .items { --cardmin: 17rem; }
[data-type="hidden-word"] .items, [data-type="note-to-key"] .items { --cardmin: 18rem; }
[data-type="next-letter"] .items, [data-type="fill-gaps"] .items, [data-type="fill-octave"] .items { --cardmin: 24rem; }
[data-type="find-key"] .items, [data-type="name-key"] .items, [data-type="name-key-octave"] .items,
[data-type="copy-note"] .items, [data-type="place-note-named"] .items, [data-type="place-note-letter"] .items, [data-type="spell-word"] .items,
[data-type="place-clef"] .items, [data-type="grand-staff-place"] .items { --cardmin: 100%; }
@media (max-width: 700px) { .items { grid-template-columns: repeat(auto-fill, minmax(min(var(--cardmin, 12rem), 100%), 1fr)); } }
.item { position: relative; border: 2px solid transparent; border-radius: 14px; padding: .6rem .5rem .5rem; display: flex; flex-direction: column; gap: .5rem; align-items: stretch; background: #fff; }
.item.right { border-color: var(--base); }
.item.wrong { border-color: var(--red); }
[data-n="3"] .item.wrong, [data-n="4"] .item.wrong { border-color: var(--base); }
.item .num { position: absolute; top: .45rem; left: .55rem; font: 700 .85rem/1 "Lexend", sans-serif; color: var(--grey); }
.item .body { display: flex; flex-direction: column; align-items: center; gap: .5rem; width: 100%; }
.actions { display: flex; justify-content: center; }
.fb { display: flex; gap: .5rem; align-items: flex-start; min-height: 1.4em; font-size: .98rem; }
.fbicon svg.mk { width: 1.5rem; height: 1.5rem; flex: none; }
.fbtext { padding-top: .1rem; }
.item.model { background: #F4F4F8; }
.prompt, .prompt-letter { font: 700 1.6rem/1 "Lexend", sans-serif; color: var(--shade); text-align: center; }
.prompt-letter { margin-top: .2rem; }

/* boxes */
.box { width: 2.7rem; height: 2.7rem; border: 2px solid var(--base); border-radius: 4px; background: #fff; text-align: center; font: 600 1.3rem/1 "Fira Sans", sans-serif; color: var(--ink); padding: 0; text-transform: uppercase; }
.box.wide { width: 3.5rem; }
.box[readonly] { font-family: "Kalam", cursive; font-weight: 400; color: var(--pencil); background: #fff; }
.box:disabled { background: #F4F4F8; color: var(--ink); opacity: 1; }
.model { font-family: "Kalam", cursive; color: var(--pencil); font-size: 1.15rem; margin-left: .25rem; }
.stavebox { position: relative; width: 100%; padding-bottom: 3.3rem; margin: 0 auto; }
.boxrow { position: absolute; left: 0; right: 0; bottom: 0; height: 3.1rem; }
.bx { position: absolute; top: 0; transform: translateX(-50%); display: flex; align-items: center; white-space: nowrap; }
.keypick { text-align: center; color: var(--grey); font-size: .95rem; }
.letters { display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; }
.cell { width: 2.9rem; height: 2.9rem; border: 2px solid var(--base); border-radius: 6px; display: grid; place-items: center; background: #fff; }
.cell.fixed { background: var(--tint); font: 700 1.4rem/1 "Fira Sans", sans-serif; color: var(--shade); }
.cell .box { width: 100%; height: 100%; border: 0; border-radius: 4px; }
.rowarrow { width: 100%; max-width: 30rem; height: 1.2rem; display: block; margin: 0 auto .2rem; }

/* keyboards */
.kb { width: 100%; display: grid; gap: .7rem; }
.kbrow { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); width: 100%; max-height: 14rem; }
.wk { position: relative; background: #fff; border: 1px solid var(--ink); border-left: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4%; min-width: 0; }
.wk:first-child { border-left: 1px solid var(--ink); }
.bk { position: absolute; top: 0; height: 62%; background: var(--ink); border-radius: 0 0 3px 3px; z-index: 2; pointer-events: none; }
.tapkey { cursor: pointer; }
.wk.on { background: var(--tint); }
.wk.ans { box-shadow: inset 0 0 0 3px var(--pencil); }
.wk.pick { background: var(--tint); box-shadow: inset 0 0 0 3px var(--base); }
.wk .mark { position: absolute; bottom: 6%; font-size: 1.1rem; color: var(--pencil); }
.klab { font: 400 clamp(.6rem, 1.1vw, .9rem)/1 "Fira Sans", sans-serif; color: var(--shade); }
.klab.hand { font-family: "Kalam", cursive; font-size: clamp(.7rem, 1.4vw, 1.1rem); color: var(--pencil); }
.klab.b { font-weight: 700; }
.kb-bx { width: 94%; display: flex; justify-content: center; position: relative; z-index: 3; }
.kb-bx .box { width: 100%; height: 2.3rem; padding: 0; font-size: 1rem; border-width: 2px; }
.kb-bx .box.wide { font-size: .95rem; }
.sharedkb { margin-top: 1rem; }

/* drawing */
.draw { touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.draw .piece { cursor: grab; }
.draw .piece:focus { outline: none; }
.draw .piece:focus-visible .hit { stroke: var(--base); stroke-width: .08; stroke-dasharray: .3 .2; }
.draw .handle { cursor: nwse-resize; }
.draw.locked .piece { pointer-events: none; }
.banklab { pointer-events: none; }
.drawbar { display: flex; gap: .8rem; align-items: center; justify-content: center; color: var(--grey); font-size: .92rem; }
svg.tapfocus { outline: none; }
.tap { cursor: pointer; }

.finish { margin-top: 1.6rem; padding: 1.2rem 0 0; border-top: 2px dashed var(--divider); text-align: center; }
.bigscore { font-size: 1.6rem; margin: .2rem 0 1rem; }
.bigscore b { font-family: "Lexend", sans-serif; color: var(--shade); }
.finish .row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
.finish[hidden] { display: none; }

footer { text-align: center; font-size: .82rem; color: var(--grey); border-top: 1px solid #ddd; padding: 12px 0 20px; margin-top: 20px; }
footer b { color: var(--ink); }

@media (max-width: 600px) {
  html { font-size: 16px; }
  .sheet { padding: 10px 8px 4px; }
  .banner { padding: 14px 16px; border-radius: 16px 16px 0 0; }
  .banner h1 { font-size: 1.5rem; }
  .banner .corner { min-width: 5.5rem; padding: 8px 10px; }
  .info, .todo, .practise, .home, .lessonmenu { padding-left: 14px; padding-right: 14px; }
  .frame { border-radius: 0 0 16px 16px; }
  .th { font-size: 1.15rem; }
  .lessons { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .example *, .example { animation: none !important; } }
[hidden] { display: none !important; }
.opts { gap: .4rem; }
.opt { min-width: 2.6rem; padding-left: .6rem; padding-right: .6rem; }
svg text { pointer-events: none; }
/* ---- Lessons 13 on: rhythm figures and picture options ---- */
.rwrap { display: flex; justify-content: center; margin-bottom: .4rem; }
.rfig { overflow: visible; }
.opts.pics { gap: .8rem; }
.opt.pick.pic { padding: .3rem .5rem; min-width: 0; }
.opt.pick.pic .rfig { width: 100%; height: auto; display: block; }
.opt.pick.pic.chosen { background: var(--tint); }
.opt.pick.pic.pen { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--pencil); }
.textfig { max-width: 100%; }
.clue { font-family: "Lexend", sans-serif; font-weight: 600; color: var(--shade); font-size: 1.05rem; margin: .2rem 0 .6rem; text-align: center; }
.clue.big { font-size: 1.6rem; }
[data-type="stem-pick"] .items { --cardmin: 24rem; }
[data-type="longer-note"] .items, [data-type="matching-note"] .items, [data-type="missing-note"] .items { --cardmin: 22rem; }
.opts.pics .opt.pick.pic { flex: 1 1 40%; max-width: 48%; }
.opt.pick.pic .rfig { width: 100%; max-width: 100%; }
[data-type="note-tree"] .items { --cardmin: 24rem; }
[data-type="add-beats"] .items { --cardmin: 16rem; }
.opt.pick.pic .rfig { max-width: 8rem; margin: 0 auto; }

/* ---- one question at a time, and the Help panel ---- */
[hidden] { display: none !important; }
.prog { display: flex; align-items: center; gap: 1rem; margin: 0 0 1rem; font: 600 .95rem "Lexend", sans-serif; color: var(--shade); }
.prog .bar { flex: 1; height: .6rem; border-radius: 99px; background: var(--tint); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--base); border-radius: 99px; transition: width .3s; }
.practise.single .items { display: block; max-width: 46rem; margin: 0 auto; }
.practise.single .item { --sp: 42px; }
.practise.single .th { margin-bottom: .8rem; }
.nextrow { display: flex; justify-content: center; margin-top: 1rem; }
.cornerrow { display: flex; align-items: center; gap: .8rem; }
.helpbtn { font: 700 1rem "Lexend", sans-serif; background: #fff; color: var(--shade); border: 2px solid #fff; border-radius: 12px; padding: .7rem 1.1rem; cursor: pointer; min-height: 2.75rem; }
.helpbtn:hover { background: var(--tint); }
.helpbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.helpdlg { border: 3px solid var(--base); border-radius: 18px; padding: 0; max-width: min(56rem, 94vw); width: 94vw; max-height: 90vh; overflow: auto; color: var(--ink); }
.helpdlg::backdrop { background: rgba(30, 30, 70, .55); }
.helpbody { padding: 1.2rem 1.5rem 0; }
.helpbody .label { font: 700 .75rem "Lexend", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--shade); margin: .8rem 0 .3rem; }
.helpbody .wtd { font: 700 1.3rem "Lexend", sans-serif; color: var(--shade); margin: .2rem 0 .4rem; }
.helpbody .hsteps { margin: .4rem 0 0 1.2rem; }
.helpfoot { display: flex; justify-content: center; padding: 1rem; position: sticky; bottom: 0; background: #fff; }
@media (max-width: 700px) { .cornerrow { gap: .4rem; } .helpbtn { padding: .5rem .7rem; font-size: .9rem; min-height: 2.75rem; } .banner .corner { min-width: 5.6rem; padding: 8px 10px; } .practise.single .item { --sp: 28px; } }
.helpex { margin: .6rem 0 .2rem; }
.helpbody { padding-bottom: 1.4rem; }
.helpdlg[open] { display: flex; flex-direction: column; overflow: hidden; }
.helpbody { overflow: auto; flex: 1 1 auto; min-height: 0; }
.helpfoot { position: static; flex: none; border-top: 1px solid var(--tint); }

</style>
</head>

<script>
(function () { var G = globalThis; G.TA = G.TA || {}; G.TA.DATA = {"_about": "Lessons 1 to 12 of the Music Theory workbook, for the Theory Practice app. Every student-facing string here is copied from Isaac's lesson files (Source files/lessonNN.json and the captions and hints inside lessonNN.py, 2 November 2026). Do not reword them. A string the app needs that is not here goes in src/strings.js and passes tests/lint. 'introduces' lists the ideas a lesson teaches; a lesson may use only ideas introduced by itself or an earlier lesson (src/00-core.js TA.allowed). 'items' is the number of exercises in one practice set (the book's count, minus its old model answer where it had one).", "version": "2026-11-02", "lintExceptions": {"_about": "Book wording that breaks a lint rule. The app keeps the book's words until Isaac decides (asked 2 November 2026). tests/check.js lists these as 'waiting on Isaac' and does not fail on them. Remove a line once he has answered, and change the text in both the book and here if he rewords it.", "A stave has five lines": "Lesson 1 info starts with the article A (the A rule, 12 October)", "A clef at the start": "Lesson 2 info", "A dot either side of line 4": "Lesson 2 bass clef step 4", "A tune moves by": "Lesson 5 info", "A note is an oval": "Lesson 7 info", "A and G can each go in two places": "Lesson 10 Task 3: starts with the note A", "A stem reaches about three": "Isaac's Lesson 14 wording (2 November 2026)", "A flag always goes on the": "Isaac's Lesson 14 wording (2 November 2026)", "A stem can point up or down": "Isaac's Lesson 14 wording (2 November 2026)", "A flag?": "Isaac's Lesson 14 wording (2 November 2026)", "whole note": "Isaac's Lesson 14 wording (2 November 2026)", "half note": "Isaac's Lesson 14 wording (2 November 2026)", "quarter note": "Isaac's Lesson 14 wording (2 November 2026)", "eighth note": "Isaac's Lesson 14 wording (2 November 2026)", "A flag always goes": "Isaac's Lesson 14 wording (2 November 2026)"}, "lessons": [{"n": 1, "title": "The stave", "introduces": ["stave", "line-space", "line-number", "space-number"], "learn": {"text": "A **stave** has **five lines** and **four spaces**, counted from the bottom up. Every note sits either **on a line** or **in a space**.", "diagram": "A stave with no clef. Lines numbered Line 1 to Line 5 and spaces Space 1 to Space 4, counted from the bottom, with the caption 'count up from the bottom'. One line note and one space note labelled 'Line note' and 'Space note'.", "worked": [{"task": "t1", "head": "Task 1: line or space?", "hint": "Is there a line going through it (line) or does it sit between the lines (space)?"}, {"task": "t2", "head": "Task 2: which line?", "hint": "Count up from line 1."}, {"task": "t3", "head": "Task 3: which space?", "hint": "Count up from space 1."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Line or space?", "instruction": "Write **line** or **space** in the box under each note.", "type": "line-or-space", "items": 8, "clef": null}, {"id": "t2", "number": 2, "heading": "Which line?", "instruction": "Write the line number (1 to 5).", "type": "which-line", "items": 5, "clef": null}, {"id": "t3", "number": 3, "heading": "Which space?", "instruction": "Write the space number (1 to 4).", "type": "which-space", "items": 5, "clef": null}]}, {"n": 2, "title": "Clefs", "introduces": ["clef-treble", "clef-bass"], "learn": {"text": "A **clef** at the start of every stave tells you which note each line stands for.", "diagram": "Two panels. Treble clef: a printed treble clef with line 2 highlighted, a note on line 2 and the letter G beside the stave; title 'Treble clef'; caption 'The curl wraps around line 2, so line 2 is G. For higher sounds.' Bass clef: a printed bass clef with line 4 highlighted, a note on line 4 and the letter F; title 'Bass clef'; caption 'The dots sit either side of line 4, so line 4 is F. For lower sounds.'", "worked": [{"task": "t1", "head": "Treble clef", "steps": ["Dot just below line 2", "Up to line 3, curve round", "Down to line 1, curve round", "Curl up high and hook over", "Down the middle to a blob"], "note": "Animate the hand-drawn clef one stroke at a time (curriculum/clef-strokes.json), the new stroke in red."}, {"task": "t2", "head": "Bass clef", "steps": ["Big dot on line 4", "Curve up over line 5", "Sweep down past line 2", "A dot either side of line 4"], "note": "As above."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Trace these two treble clefs, then draw 5 more", "appHeading": "Place and size these treble clefs", "type": "place-clef", "clef": "treble", "items": 7, "traced": 2, "note": "Isaac (2 November): students drag a clef from a bank onto the stave and resize it; marked on how close it is to the right place and size. The first 2 items show a faint clef to cover (the 'trace'); the other 5 have no guide."}, {"id": "t2", "number": 2, "heading": "Trace these two bass clefs, then draw 5 more", "appHeading": "Place and size these bass clefs", "type": "place-clef", "clef": "bass", "items": 7, "traced": 2}]}, {"n": 3, "title": "The musical alphabet", "introduces": ["letters", "letters-forwards-up", "letters-backwards-down"], "learn": {"text": "Every note in music has a **letter name**. It tells you which note to play or sing. There are only seven: **A B C D E F G**. After G you go back to A, but it sounds higher.", "diagram": "The letters A B C D E F G then A in boxes, an arrow over them labelled 'Going up: the letters go forwards', an arrow back labelled 'Going down: the letters go backwards', and the last A marked 'back to A, but higher'. No red: this page has no notation, so arrows and labels are indigo.", "worked": [{"task": "t1", "head": "Task 1: what comes next?", "hint": "Go forwards along the line of letters above. After G comes A."}, {"task": "t2", "head": "Task 2: going down", "hint": "Go backwards along the line of letters above. Before A comes G."}, {"task": "t3", "head": "Task 3: fill the gaps", "hint": "First work out which way the letters go. C, D goes forwards."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "What comes next?", "instruction": "Write the next letter.", "type": "next-letter", "items": 4, "shown": 3, "blanks": 1, "direction": "forwards"}, {"id": "t2", "number": 2, "heading": "Going down", "instruction": "Write the next two letters.", "type": "next-letter", "items": 4, "shown": 2, "blanks": 2, "direction": "backwards"}, {"id": "t3", "number": 3, "heading": "Fill the gaps", "instruction": "Work out if each row goes forwards or backwards, then write the missing letters.", "type": "fill-gaps", "items": 4, "length": 7, "gaps": 2, "note": "Rows go forwards or backwards in a mix (never all one way); no arrow shows the direction."}]}, {"n": 4, "title": "Letter names on the keyboard", "introduces": ["keyboard", "keyboard-white-letters", "black-key-groups", "octave-eight-letters"], "learn": {"text": "Every piano and keyboard uses the seven letters of the musical alphabet on its white keys. The black keys come in groups of **two** and **three**, and they help you find your way around.", "diagram": "A keyboard with every white key lettered, the groups of two black keys outlined, the caption 'C is always the white key just to the left of a group of two black keys (outlined).', and a bracket from C to the next C labelled 'one octave: 8 letters from C up to the next C' with 'going up: the letters go forwards'. No red on this page: marks are indigo.", "worked": [{"task": "t1", "head": "Task 1: Find the Cs", "hint": "Find a group of two black keys. Colour the white key on its left and write C."}, {"task": "t2", "head": "Task 2: Name the keys", "hint": "Find the nearest C. Go forwards one white key at a time up to the box."}, {"task": "t3", "head": "Task 3: Up an octave", "hint": "Go forwards through the letters until you reach the same letter again (8 in all)."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Colour every C and write C on it", "appHeading": "Tap every C", "type": "find-key", "items": 1, "whiteKeys": 22, "target": "C", "note": "One long keyboard starting on a white key that is not C. Marked right only when every C is chosen and nothing else."}, {"id": "t2", "number": 2, "heading": "Name each key with a box", "type": "name-key", "items": 2, "whiteKeys": 11, "boxes": 4, "note": "Two keyboards of 11 white keys, each starting on a different letter, 4 boxed white keys each."}, {"id": "t3", "number": 3, "heading": "Fill in the octave", "type": "fill-octave", "items": 4, "length": 8}]}, {"n": 5, "title": "Higher and lower", "introduces": ["higher-lower", "up-down", "step-leap"], "learn": {"text": "High sounds are like a whistle and low sounds are like a big drum. The higher a note sits on the stave, the higher it sounds. A tune moves by **steps** and **leaps**.", "diagram": "A stave with no clef and notes climbing, a red arrow labelled 'higher on the stave = higher sound', with 'lower sound' and 'higher sound' at its ends; a step labelled 'to the next line or space' and a leap labelled 'skips a line or space'.", "worked": [{"task": "t1", "head": "Task 1: Circle the higher note", "hint": "Find the note in each pair that sits higher on the stave. Draw a circle around it."}, {"task": "t2", "head": "Task 2: Up or down?", "hint": "Is the second note higher or lower than the first one? Write up or down in the box."}, {"task": "t3", "head": "Task 3: Step or leap?", "hint": "Next line or space? Write step. Skips over a line or space? Write leap."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Which note in each pair sits higher? Circle it.", "appHeading": "Which note in each pair sits higher? Tap it.", "type": "higher-note", "items": 7, "clef": null}, {"id": "t2", "number": 2, "heading": "Do these pairs of notes go up or down?", "type": "up-down", "items": 5, "clef": null}, {"id": "t3", "number": 3, "heading": "Do these pairs of notes move by a step or a leap?", "type": "step-leap", "items": 5, "clef": null}]}, {"n": 6, "title": "Treble clef notes", "introduces": ["read-treble"], "learn": {"text": "In the treble clef, every line and space has its own letter name. The bottom line is **E**. Going up one line or space at a time, the letters follow the musical alphabet.", "diagram": "A treble clef stave with all nine notes E F G A B C D E F, a 'Lines' row of letters (E G B D F) and a 'Spaces' row (F A C E) under them, and a red arrow labelled 'going up the stave, the letters go forwards: E F G A B C D E F'.", "worked": [{"task": "t1", "head": "Task 1: Name the note", "hint": "Start on the bottom line, E. Count up the alphabet, one line or space at a time, to the note."}, {"task": "t2", "head": "Task 2: Find the letter", "hint": "Find the letter in the diagram above. Circle the note that sits on that line or in that space."}, {"task": "t3", "head": "Task 3: Find the word", "hint": "Name each note. Then read the letters from left to right to find the word."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "What is each note called? Write its letter in the box.", "type": "name-note", "items": 8, "clef": "treble"}, {"id": "t2", "number": 2, "heading": "Which note matches the letter? Circle it.", "appHeading": "Which note matches the letter? Tap it.", "type": "find-letter", "items": 4, "clef": "treble", "choices": 3}, {"id": "t3", "number": 3, "heading": "Name each note to find the two hidden words.", "type": "hidden-word", "items": 2, "clef": "treble"}]}, {"n": 7, "title": "Drawing notes", "introduces": ["draw-note"], "learn": {"text": "A note is an oval, a little wider than it is tall. Draw it so anyone can see straight away whether it is **on a line** or **in a space**.", "diagram": "Five pencil notes on a treble clef stave, each with a tick or a red cross and two caption lines: line note ('the line goes through', 'the middle'); space note ('fills the space and', 'just touches both lines'); a circle ('too round:', 'make it an oval'); too big ('it crosses the lines', 'around it'); half on a line ('is it a line or', 'a space? No one can tell').", "worked": [{"task": "t1", "head": "Task 1: Trace, then copy", "hint": "Trace over the light note. Then draw the same note in the gap: the same line or space, and the same size."}, {"task": "t2", "head": "Task 2: Line or space", "hint": "Count up from the bottom to the line or space. Line note: line through the middle. Space note: fill the space."}, {"task": "t3", "head": "Task 3: Is it clear?", "hint": "Look at the right and wrong notes above. Clear? Tick it. Not clear? Cross it."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Trace each light note, then draw the same note beside it.", "appHeading": "Place a note beside each light note: the same line or space, and the same size.", "type": "copy-note", "items": 6, "clef": "treble"}, {"id": "t2", "number": 2, "heading": "Draw a note on each line or in each space.", "appHeading": "Place a note on each line or in each space.", "type": "place-note-named", "items": 4, "clef": "treble"}, {"id": "t3", "number": 3, "heading": "Is each note drawn clearly? Tick or cross.", "type": "clear-note", "items": 5, "clef": "treble"}], "noteKinds": {"_about": "Sizes in staff spaces, from lesson07.py KINDS (rx, ry are radii; offset is how far the centre sits from its line or space).", "line": {"clear": true, "rx": 0.82, "ry": 0.5, "offset": 0, "caption": ["the line goes through", "the middle"]}, "space": {"clear": true, "rx": 0.82, "ry": 0.5, "offset": 0, "caption": ["fills the space and", "just touches both lines"]}, "circle": {"clear": false, "rx": 0.5, "ry": 0.5, "offset": 0, "title": "a circle", "caption": ["too round:", "make it an oval"]}, "big": {"clear": false, "rx": 1.25, "ry": 0.95, "offset": 0, "title": "too big", "caption": ["it crosses the lines", "around it"]}, "half": {"clear": false, "rx": 0.82, "ry": 0.5, "offset": 0.27, "title": "half on a line", "caption": ["is it a line or", "a space? No one can tell"]}}}, {"n": 8, "title": "Treble clef memory aids", "introduces": ["draw-treble", "aid-treble"], "learn": {"text": "Lines: use **Every Good Boy Deserves Fruit**. Spaces: use **FACE**.", "diagram": "Two treble clef staves. Lines: a note on each line with Every, Good, Boy, Deserves, Fruit under them and the caption 'Lines: say the words from the bottom line up'. Spaces: a note in each space spelling F A C E, caption 'Spaces: FACE, bottom up' and 'the spaces spell FACE'.", "worked": [{"task": "t1", "head": "Task 1: Draw a line note", "hint": "Say Every Good Boy Deserves Fruit from the bottom line up. Stop at the word that starts with the letter. Draw it there."}, {"task": "t2", "head": "Task 2: Draw a space note", "hint": "Say F, A, C, E from the bottom space up. Stop at the letter. Draw the note in that space."}, {"task": "t3", "head": "Task 3: Spell the word", "hint": "Draw a note for each letter. Line word or FACE letter? Use the right memory aid to find where it goes."}]}, "beforeTasks": "**Try to do these by memorising the memory aid rather than looking at the chart with the answers.**", "tasks": [{"id": "t1", "number": 1, "heading": "Draw the line notes.", "appHeading": "Place the line notes.", "type": "place-note-letter", "where": "line", "items": 4, "clef": "treble"}, {"id": "t2", "number": 2, "heading": "Draw the space notes.", "appHeading": "Place the space notes.", "type": "place-note-letter", "where": "space", "items": 4, "clef": "treble"}, {"id": "t3", "number": 3, "heading": "Draw the notes to spell each word.", "appHeading": "Place the notes to spell each word.", "instruction": "**E** and **F** can each go in two places. Either one is right.", "type": "spell-word", "items": 2, "clef": "treble"}]}, {"n": 9, "title": "Bass clef notes", "introduces": ["read-bass"], "learn": {"text": "In the bass clef, every line and space has its own letter name. The bottom line is **G**. Going up one line or space at a time, the letters follow the musical alphabet.", "diagram": "A bass clef stave with all nine notes G A B C D E F G A, a 'Lines' row (G B D F A) and a 'Spaces' row (A C E G), and a red arrow labelled 'going up the stave, the letters go forwards: G A B C D E F G A'.", "worked": [{"task": "t1", "head": "Task 1: Name the note", "hint": "Start on the bottom line, G. Count up the alphabet, one line or space at a time, to the note."}, {"task": "t2", "head": "Task 2: Find the letter", "hint": "Find the letter in the diagram above. Circle the note that sits on that line or in that space."}, {"task": "t3", "head": "Task 3: Find the word", "hint": "Name each note. Then read the letters from left to right to find the word."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "What is each note called? Write its letter in the box.", "type": "name-note", "items": 8, "clef": "bass"}, {"id": "t2", "number": 2, "heading": "Which note matches the letter? Circle it.", "appHeading": "Which note matches the letter? Tap it.", "type": "find-letter", "items": 4, "clef": "bass", "choices": 3}, {"id": "t3", "number": 3, "heading": "Name each note to find the two hidden words.", "type": "hidden-word", "items": 2, "clef": "bass"}]}, {"n": 10, "title": "Bass clef memory aids", "introduces": ["draw-bass", "aid-bass"], "learn": {"text": "Lines: use **Good Burritos Don't Fall Apart**. Spaces: use **All Cows Eat Grass**.", "diagram": "Two bass clef staves. Lines: a note on each line with Good, Burritos, Don't, Fall, Apart under them, caption 'Lines: say the words from the bottom line up'. Spaces: a note in each space with All, Cows, Eat, Grass, caption 'Spaces: bottom space up'.", "worked": [{"task": "t1", "head": "Task 1: Draw a line note", "hint": "Say Good Burritos Don't Fall Apart from the bottom line up. Stop at the word that starts with the letter. Draw it there."}, {"task": "t2", "head": "Task 2: Draw a space note", "hint": "Say All Cows Eat Grass from the bottom space up. Stop at the word that starts with the letter. Draw the note in that space."}, {"task": "t3", "head": "Task 3: Spell the word", "hint": "Draw a note for each letter. Line word or space word? Use the right memory aid to find where it goes."}]}, "beforeTasks": "**Try to do these by memorising the memory aid rather than looking at the chart with the answers.**", "tasks": [{"id": "t1", "number": 1, "heading": "Draw the line notes.", "appHeading": "Place the line notes.", "type": "place-note-letter", "where": "line", "items": 4, "clef": "bass"}, {"id": "t2", "number": 2, "heading": "Draw the space notes.", "appHeading": "Place the space notes.", "type": "place-note-letter", "where": "space", "items": 4, "clef": "bass"}, {"id": "t3", "number": 3, "heading": "Draw the notes to spell each word.", "appHeading": "Place the notes to spell each word.", "instruction": "**A** and **G** can each go in two places. Either one is right.", "type": "spell-word", "items": 2, "clef": "bass"}]}, {"n": 11, "title": "Notes on the keyboard", "introduces": ["octave-numbers", "middle-c"], "learn": {"text": "Every key has a letter name and an **octave number**, which goes up by one at each C. The C in the middle of the piano is **Middle C (C4)**. Each note on a stave sits right above its own key.", "diagram": "A keyboard from C2 to B5 with C2, C3, C4, C5 printed on every C (C4 bold) and octave brackets under the keys ('octave 2' ... 'octave 4: starts at Middle C'); a bass stave over the low keys and a treble stave over the high keys, each note joined to its key by a grey dotted line; red octave brackets beside each stave (treble: 4 from line 1 to line 3, 5 from space 3 to line 5; bass: 2 from line 1 to line 2, 3 from space 2 to line 5).", "worked": [{"task": "t1", "head": "Task 1: Name the key", "hint": "Find the C to the left and read its number. Count forwards to the key. Keep the same number."}, {"task": "t2", "head": "Task 2: Treble clef notes", "hint": "Name the note. Bottom line E up to B is octave 4. C in space 3 up to top line F is octave 5."}, {"task": "t3", "head": "Task 3: Bass clef notes", "hint": "Name the note. Bottom line G up to B is octave 2. C in space 2 up to top line A is octave 3."}]}, "tasks": [{"id": "t1", "number": 1, "heading": "Write the letter and octave number in every box.", "type": "name-key-octave", "items": 1, "from": "C2", "to": "B5", "boxes": 8, "note": "Every C is printed with its number in handwriting, plus a few other given keys (the book gives A3, D4, B4, F5; choose different ones each set). Boxed keys are white keys only."}, {"id": "t2", "number": 2, "heading": "What note and octave?", "type": "name-note-octave", "items": 5, "clef": "treble"}, {"id": "t3", "number": 3, "heading": "What note and octave?", "type": "name-note-octave", "items": 5, "clef": "bass"}]}, {"n": 12, "title": "Revision: reading notes", "revision": true, "introduces": ["grand-staff-choose"], "learn": null, "tasks": [{"id": "t1", "number": 1, "heading": "Name each note to find the hidden word. (See Lessons 6 and 9)", "type": "hidden-word", "items": 6, "clef": "mixed", "note": "Three words in the treble clef and three in the bass, in a mixed order."}, {"id": "t2", "number": 2, "heading": "Draw each note on the right stave, in the right octave.", "appHeading": "Place each note on the right stave, in the right octave.", "instruction": "This is a **grand staff**: treble on top, bass below. The octave number tells you which stave to use.", "type": "grand-staff-place", "items": 9, "newHere": true, "note": "The grand staff is new on this page (its own lesson is 32), so this task keeps an explanation and its first item is a worked model, shown done in pencil."}, {"id": "t3", "number": 3, "heading": "Name each note, then join it to its key. (See Lesson 11)", "appHeading": "Name each note, then tap its key. (See Lesson 11)", "type": "note-to-key", "items": 8, "from": "C2", "to": "B5", "note": "Short staves under the keyboard: bass notes on the left, treble on the right."}]}, {"n": 13, "title": "Note shapes and names", "introduces": ["note-names", "note-parts"], "learn": {"text": "In a tune, /* Theory Practice: core music model, shared checks and marking helpers.
 *
 * FRAMEWORK FILE: written and tested with the plan (2 November 2026). Generators, screens and drawing code are
 * built on top of it. Do not change a fact in here (a pitch, a range, a tolerance, a lint rule) without Isaac's
 * say-so; add new helpers below the existing ones instead. tests/core.test.js pins every fact.
 *
 * Runs in the browser (plain script, defines globalThis.TA) and in Node (tests load it into a vm context).
 * Stave positions are half-spaces from the bottom line: 0 = line 1, 1 = space 1, 2 = line 2 ... 8 = line 5.

          fb.innerHTML = '<span class="fbtext">' + D.esc(S().marking.model) + '</span>'; card.classList.add('model'); checkBtn.hidden = true;
        }

        function handle(resp) {
          if (st.done) return;
          const gen = TA.GEN[n][set.task.id];
          const m = gen.mark(item, resp);
          st.tries++;
          if (m.correct) {
            st.done = true; if (st.tries === 1) st.first = true; else if (st.first === null) st.first = false;
            say(true, m.feedback); view.lock(true); checkBtn.hidden = true;
            if (single && order[order.length - 1].id !== item.id) { nextBtn.hidden = false; nextBtn.focus({ preventScroll: true }); }
          } else {
            if (!built.needsCheck && view.clear) view.clear();           // a tap or a choice: pick again
            if (st.tries === 1) { st.first = false; say(false, firstWrong(item, m, hintFor(L, set.task))); }
            else { say(false, m.feedback + ' ' + S().marking.copyIn); if (view.reveal) view.reveal(item.answer); }
          }
          ctl.change();
          const sc = setScore();
          if (sc && all()) finish();
        }
      });
    });

    // one question at a time: the next one appears when the student presses Next
    const prog = root.querySelector('.prog');
    function show(i) {
      at = i;
      order.forEach((q, k) => { q.card.hidden = single && k !== i; });
      const cur = order[i];
      root.querySelectorAll('section.task').forEach((sec) => { sec.hidden = single && sec !== cur.sec; });
      root.querySelectorAll('hr.divide').forEach((h) => { h.hidden = single; });
      if (prog) {
        prog.hidden = !single;
        prog.querySelector('.pl').textContent = 'Question ' + (i + 1) + ' of ' + order.length;
        prog.querySelector('.bar i').style.width = Math.round((i / order.length) * 100) + '%';
      }
      if (ctx.onTask) ctx.onTask(cur.task.id);
      if (state[cur.id].done && i < order.length - 1) show(i + 1);      // a model item that is already done
    }
    order.forEach((q, k) => { q.card.querySelector('.next').addEventListener('click', () => { show(k + 1); if (root.scrollIntoView) root.scrollIntoView({ block: 'start' }); }); });
    root.classList.toggle('single', single);
    show(0);

    // Lesson 12 Task 3: one keyboard for all the items, used for whichever item the student is on
    const kbHost = root.querySelector('.sharedkb');
    if (kbHost) {
      const task = sets.find((s) => s.task.type === 'note-to-key').task;
      kbHost.innerHTML = V.keyboard({ keys: TA.whiteKeysBetween(task.from, task.to), octaveLabels: true }, { mode: 'tap', minKey: 18 });
      kbHost.querySelectorAll('.wk').forEach((k) => {
        const tap = () => {
          const v = active && views[active];
          if (!v || state[active].done || !v.view.setKey) return;
          kbHost.querySelectorAll('.wk.pick').forEach((x) => x.classList.remove('pick'));
          k.classList.add('pick');
          v.view.setKey(Number(k.dataset.i));
        };
        k.addEventListener('click', tap);
        k.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
      });
      root.addEventListener('focusin', () => { kbHost.querySelectorAll('.wk.pick').forEach((x) => x.classList.remove('pick')); });
    }

    function firstWrong(item, m, hint) {
      let specific = '';
      const kind = item.input.kind;
      if (['place-note', 'place-notes', 'place-clef', 'grand-place'].includes(kind) && m.feedback) {
        specific = m.feedback.replace(/^Not this time\.\s*/, '').replace(/\s*Put it .*$/, '');
        if (m.detail && m.detail.why === 'stave') specific = S().placed.grandStave;
      }
      return S().marking.wrong + ' ' + (specific ? specific + ' ' : '') + hint;
    }
    const all = () => Object.values(state).every((s) => s.done);
    function finish() {
      const sc = setScore();
      const host = root.querySelector('.finish');
      host.hidden = false;
      host.innerHTML = '<h3 class="th">' + D.esc(S().marking.done) + '</h3><p class="bigscore">' + D.esc(S().marking.score) + ' <b>' + sc.got + ' / ' + sc.total + '</b></p>' +
        '<div class="row"><button type="button" class="btn solid again">' + D.esc(S().marking.again) + '</button><a class="btn" href="#/">' + D.esc(S().lesson.back) + '</a></div>';
      host.querySelector('.again').addEventListener('click', () => ctx.again());
      if (ctx.finished) ctx.finished(sc.got, sc.total);
      if (prog) { prog.querySelector('.bar i').style.width = '100%'; }
      host.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    setScore();
    return { state, views, show };
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---- ui/50-progress.js ---- */
/* Theory Practice: progress (RULES 5.5). Each lesson's best and latest first-try score and the date are kept in the
 * browser (localStorage, always inside try/catch: it can be empty or blocked). Send my results opens Isaac's Google
 * Form pre-filled, the way Sight Singer's Send my progress does. Nothing is sent unless the student presses Submit. */
(function (G) {
  'use strict';
  const TA = G.TA;
  const KEY = 'tawa-theory-practice-v1';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // The form address and its entry ids go here, in one place. Until Isaac makes the form this stays null and the
  // Send my results button is hidden. Form: a "Results" paragraph question and an "App version" short-answer
  // question, with "Collect email addresses: Verified" on. Example:
  //   { url: 'https://docs.google.com/forms/d/e/FORM_ID/viewform', results: 'entry.1111111111', version: 'entry.2222222222' }
  TA.RESULTS_FORM = null;
  TA.APP_VERSION = 'Theory Practice 1.0, Lessons 1 to 12, 2 Nov 2026';

  let memory = { lessons: {} };                              // used when the browser will not store anything
  const read = () => {
    try { const raw = G.localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.lessons) return d; } } catch (e) { /* blocked or empty */ }
    return memory;
  };
  const write = (d) => { memory = d; try { G.localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } };

  const P = (TA.progress = {});
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  P.dateText = (iso) => { const m = /^(\d+)-(\d+)-(\d+)$/.exec(iso || ''); return m ? Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] : ''; };
  P.get = (n) => read().lessons[n] || null;
  P.record = function (n, got, total) {
    const d = read();
    const prev = d.lessons[n] || {};
    const now = { got, total, date: today() };
    const better = !prev.best || got / total >= prev.best.got / prev.best.total;
    d.lessons[n] = { latest: now, best: better ? now : prev.best };
    return write(d);
  };
  P.line = function (n) {
    const r = P.get(n);
    return r ? 'Latest ' + r.latest.got + '/' + r.latest.total + ', best ' + r.best.got + '/' + r.best.total : '';
  };
  // one line for each lesson that has a score: "Lesson 6 Treble clef notes: best 15/16, last 13/16, 2 Nov"
  P.resultsText = function () {
    const out = [];
    TA.DATA.lessons.forEach((L) => {
      const r = P.get(L.n);
      if (r) out.push('Lesson ' + L.n + ' ' + L.title + ': best ' + r.best.got + '/' + r.best.total + ', last ' + r.latest.got + '/' + r.latest.total + ', ' + P.dateText(r.latest.date));
    });
    return out.join('\n');
  };
  P.canSend = () => !!TA.RESULTS_FORM && !!P.resultsText();
  P.send = function () {
    const F = TA.RESULTS_FORM;
    if (!F) return false;
    const q = 'usp=pp_url&' + encodeURIComponent(F.results) + '=' + encodeURIComponent(P.resultsText()) + '&' + encodeURIComponent(F.version) + '=' + encodeURIComponent(TA.APP_VERSION);
    G.open(F.url + '?' + q, '_blank', 'noopener');
    return true;
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---- ui/90-app.js ---- */
/* Theory Practice: the app shell. Home, Lesson, Learn and Practise screens, and TA.ui for the tests. */
(function (G) {
  'use strict';
  const TA = G.TA;
  const D = TA.draw;
  const S = () => TA.STRINGS;
  const UI = (TA.ui = {});
  let app, cur = { screen: 'home' };
  const lessonOf = (n) => TA.DATA.lessons.find((l) => l.n === n);
  const E = D.esc;

  const banner = (eyebrow, title, corner) => '<header class="banner"><div><div class="eyebrow">' + E(eyebrow) + '</div><h1>' + E(title) + '</h1></div>' + (corner || '') + '</header>';
  const footer = () => '<footer>' + E(S().app.school) + ' &nbsp;|&nbsp; Music Theory &nbsp;|&nbsp; <b>' + E(S().app.name) + '</b></footer>';

  UI.learnSteps = (n) => TA.learn.steps(n).length;

  // ---------- screens ----------
  function home() {
    let list = '';
    TA.DATA.lessons.forEach((L) => {
      list += '<li><a class="lrow" href="#/lesson/' + L.n + '"><span class="ln">' + L.n + '</span><span class="lt">' + E(L.title) + '</span><span class="ls">' + E(TA.progress.line(L.n)) + '</span></a></li>';
    });
    const send = TA.progress.canSend() ? '<button type="button" class="btn solid send">' + E(S().results.send) + '</button>' : '';
    return {
      html: '<div class="sheet">' + banner(S().app.school, S().app.name) + '<section class="frame home"><p class="label">' + E(S().home.part1) + '</p><h2 class="lessonshead">' + E(S().home.lessons) + '</h2><ol class="lessons">' + list + '</ol>' + send + '</section>' + footer() + '</div>',
      mount() { const b = app.querySelector('.send'); if (b) b.addEventListener('click', () => TA.progress.send()); }
    };
  }
  function lesson(n) {
    const L = lessonOf(n), prog = TA.progress.line(n);
    const learn = L.learn ? '<a class="bigbtn" href="#/lesson/' + n + '/learn/1"><span class="bt">' + E(S().lesson.learn) + '</span><span class="bs">' + E(L.learn.worked.length + 1 + ' steps') + '</span></a>' : '';
    return {
      html: '<div class="sheet">' + banner('Music theory · Lesson ' + n, L.title, '<a class="corner" href="#/">' + E(S().home.lessons) + '</a>') +
        '<section class="frame lessonmenu"><div class="bigbtns">' + learn + '<a class="bigbtn solid" href="#/lesson/' + n + '/practise"><span class="bt">' + E(S().lesson.practise) + '</span><span class="bs">' + E(L.revision ? S().lesson.revision : L.tasks.length + ' tasks') + '</span></a></div>' +
        (prog ? '<p class="progline">' + E(prog) + '</p>' : '') + '</section>' + footer() + '</div>',
      mount() {}
    };
  }
  function learn(n, step) {
    const total = TA.learn.steps(n).length, s = Math.max(0, Math.min(total - 1, step));
    const L = lessonOf(n), r = TA.learn.render(n, s);
    const last = s === total - 1;
    const nav = '<nav class="learnnav"><button type="button" class="btn prev"' + (s === 0 ? ' disabled' : '') + '>' + E(S().lesson.previous) + '</button>' +
      '<span class="count">' + (s + 1) + ' / ' + total + '</span>' +
      (last ? '<a class="btn solid" href="#/lesson/' + n + '/practise">' + E(S().lesson.start) + '</a>' : '<button type="button" class="btn solid next">' + E(S().lesson.next) + '</button>') + '</nav>';
    return {
      html: '<div class="sheet learnsheet">' + banner('Music theory · Lesson ' + n, L.title, '<a class="corner" href="#/lesson/' + n + '">' + E('Lesson ' + n) + '</a>') + '<section class="frame">' + r.html + '</section>' + nav + footer() + '</div>',
      mount(root) {
        r.mount(root);
        const go = (d) => UI.go('#/lesson/' + n + '/learn/' + (s + 1 + d));
        const p = root.querySelector('.prev'), x = root.querySelector('.next');
        if (p) p.addEventListener('click', () => go(-1));
        if (x) x.addEventListener('click', () => go(1));
        cur.keys = (e) => {
          if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
          if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (s < total - 1) go(1); else UI.go('#/lesson/' + n + '/practise'); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); if (s > 0) go(-1); }
        };
      }
    };
  }
  function practise(n, seed) {
    const L = lessonOf(n), r = TA.practise.render(n, seed);
    return {
      html: '<div class="sheet practisesheet">' + banner('Music theory · Lesson ' + n, L.title, '<div class="cornerrow"><button type="button" class="helpbtn">' + E(S().help.open) + '</button><div class="corner scorebox"><span class="slab">' + E(S().marking.score) + '</span><b class="sc">0 / 0</b><a href="#/lesson/' + n + '">' + E('Lesson ' + n) + '</a></div></div>') +
        '<dialog class="helpdlg" aria-label="' + E(S().help.title) + '"><div class="helpbody"></div><div class="helpfoot"><button type="button" class="btn solid helpclose">' + E(S().help.close) + '</button></div></dialog>' +
        '<section class="frame practise">' + r.html + '</section>' + footer() + '</div>',
      mount(root) {
        let task = null;
        const dlg = root.querySelector('.helpdlg'), body = root.querySelector('.helpbody');
        root.querySelector('.helpbtn').addEventListener('click', () => {
          body.innerHTML = TA.learn.help(n, task);
          if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
        });
        root.querySelector('.helpclose').addEventListener('click', () => { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });
        dlg.addEventListener('click', (e) => { if (e.target === dlg && dlg.close) dlg.close(); });
        r.mount(root, {
          onTask: (id) => { task = id; },
          score: (g, t) => { const el = root.querySelector('.sc'); if (el) el.textContent = g + ' / ' + t; },
          finished: (g, t) => TA.progress.record(n, g, t),
          again: () => UI.go('#/lesson/' + n + '/practise/' + (seed + 1))
        });
      }
    };
  }

  // ---------- routing ----------
  const parse = (hash) => {
    const m = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    if (m[0] !== 'lesson' || !lessonOf(Number(m[1]))) return { screen: 'home' };
    const n = Number(m[1]);
    if (m[2] === 'learn' && lessonOf(n).learn) return { screen: 'learn', lesson: n, step: Math.max(0, Number(m[3] || 1) - 1) };
    if (m[2] === 'practise') return { screen: 'practise', lesson: n, seed: Number(m[3]) || Math.floor(Date.now() / 1000) % 100000 };
    return { screen: 'lesson', lesson: n };
  };
  async function draw(route) {
    const root = app;
    if (cur.keys) { document.removeEventListener('keydown', cur.keys); cur.keys = null; }
    const view = route.screen === 'learn' ? learn(route.lesson, route.step) : route.screen === 'practise' ? practise(route.lesson, route.seed)
      : route.screen === 'lesson' ? lesson(route.lesson) : home();
    cur = Object.assign({}, route);
    root.innerHTML = view.html;
    view.mount(root);
    if (cur.keys) document.addEventListener('keydown', cur.keys);
    document.documentElement.dataset.screen = route.screen;
    await settle();
  }
  async function settle() {
    try { await Promise.all(['400 16px "Fira Sans"', '700 16px "Fira Sans"', '700 16px "Lexend"', '16px "Kalam"', '16px "Bravura"'].map((f) => document.fonts.load(f))); await document.fonts.ready; } catch (e) { /* no font loading API */ }
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  }
  UI.go = (hash) => { if (G.location.hash === hash) return draw(parse(hash)); G.location.hash = hash; return Promise.resolve(); };

  // for tests and for the first screen: show({ lesson, screen: 'learn' | 'practise', step, seed })
  UI.show = function (o) {
    o = o || {};
    if (!o.lesson) return draw({ screen: 'home' });
    if (o.screen === 'learn') return draw({ screen: 'learn', lesson: o.lesson, step: o.step || 0 });
    if (o.screen === 'practise') return draw({ screen: 'practise', lesson: o.lesson, seed: o.seed || 1 });
    return draw({ screen: 'lesson', lesson: o.lesson });
  };

  UI.start = function () {
    app = document.getElementById('app');
    try { if (G.navigator && G.navigator.webdriver) document.documentElement.classList.add('still'); } catch (e) {}
    G.addEventListener('hashchange', () => draw(parse(G.location.hash)));
    draw(parse(G.location.hash));
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

TA.ui.start();
</script>
